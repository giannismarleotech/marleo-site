    '<div class="fgroup" style="margin:0"><label>Max.</label><select id="lf_n"><option>20</option><option>40</option><option>60</option></select></div>'+
    '<button class="btn" id="lf_btn" onclick="lfSearch()" '+(LEADS_BUSY?'disabled':'')+'>'+(LEADS_BUSY?'Zoeken\u2026':'Zoeken')+'</button></div>'+
    '<div class="hint" style="margin-top:10px">Score 70+ = geen of kapotte website (bel deze eerst). 40-69 = verouderd of niet mobiel. Onder 40 = in orde. De zoekopdracht loopt via je n8n-workflow "Marleo Leadfinder".</div></div>'+
  (LEADS.length?'<div class="panelbox"><h3>'+LEADS.length+' resultaten <span class="hint" style="font-weight:400">'+LEADS.filter(function(l){return l.score>=70}).length+' zonder goede website</span></h3>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>Bedrijf</th><th>Telefoon</th><th>Website</th><th class="num">Rating</th><th class="num">Score</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
   :(LEADS_BUSY?'<div class="empty"><span class="big">\u23f3</span>Google doorzoeken en websites controleren\u2026 dit duurt 20 tot 60 seconden.</div>'
   :'<div class="empty"><span class="big">\ud83c\udfaf</span>Vul een branche en een gemeente in en klik op Zoeken.</div>'));
}
async function lfSearch(){
  var c=lfCfg();var q=document.getElementById('lf_q').value.trim(),loc=document.getElementById('lf_loc').value.trim(),n=parseInt(document.getElementById('lf_n').value)||20;
  if(!q||!loc){toast('Vul wat en waar in',true);return}
  if(!c.webhook){toast('Stel eerst de Leadfinder-webhook in bij Instellingen',true);return}
  c.lastQ=q;c.lastLoc=loc;saveData();LEADS=[];LEADS_BUSY=true;rLeads();
  try{
    var r=await fetch(c.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,location:loc,max:n})});
    if(!r.ok){throw new Error('n8n antwoordt '+r.status)}
    var j=await r.json();var list=Array.isArray(j)?j:(j.leads||j.results||[]);
    LEADS=list.map(function(x){return {naam:x.naam||x.name||'',adres:x.adres||x.address||'',tel:x.tel||x.phone||'',website:x.website||'',rating:x.rating||'',reviews:x.reviews||0,score:parseInt(x.score)||0,flags:x.flags||[],maps:x.maps||'',cat:q,plaats:loc}})
      .sort(function(a,b){return b.score-a.score});
    logAct('Leadfinder: '+LEADS.length+' resultaten voor "'+q+' '+loc+'"');
    toast('\u2705 '+LEADS.length+' bedrijven gevonden');
  }catch(e){toast('Leadfinder-fout: '+e.message,true)}
  LEADS_BUSY=false;rLeads();
}
function lfOnline(l){return !l.website?'Geen website':l.score>=70?'Kapotte/zeer zwakke website':l.score>=40?'Verouderde website':'Website ok'}
async function lfAdd(i,silent){
  var l=LEADS[i];if(!l||lfIsKnown(l)){if(!silent)toast('Staat al in je CRM');return}
  var o={id:nid('deal'),naam:l.naam,tel:l.tel||'',email:'',plaats:l.plaats||'',cat:l.cat||'',stage:'nieuw',value:250,
    rating:l.rating||'',reviews:l.reviews||'',online:lfOnline(l),prio:l.score>=70?'Hoog':l.score>=40?'Normaal':'Laag',
    note:(l.website?'Website: '+l.website+'\n':'')+(l.flags&&l.flags.length?'Bevindingen: '+l.flags.join(', ')+'\n':'')+(l.maps?'Maps: '+l.maps:''),
    log:[{t:Date.now(),txt:'Gevonden via Leadfinder (score '+l.score+')'}],created:Date.now()};
  DATA.deals.push(o);saveData();
  var c=atCfg();
  if(c.token){try{
    var flds={'Naam':o.naam,'Telefoon':o.tel,'Plaats':o.plaats,'Categorie':o.cat,'Status':AT_STAGE2ST.nieuw,'Online aanwezigheid':o.online,'Prio':o.prio,'Notities':o.note};
    if(o.rating)flds['Rating']=String(o.rating);if(o.reviews)flds['Reviews']=String(o.reviews);
    var r=await fetch(atUrl(''),{method:'POST',headers:atHeaders(),body:JSON.stringify({records:[{fields:flds}],typecast:true})});
    if(r.ok){var j=await r.json();o.atId=(j.records&&j.records[0]&&j.records[0].id)||'';saveData()}
  }catch(e){}}
  logAct('Lead toegevoegd: '+o.naam);
  if(!silent){toast('\u2705 '+o.naam+' staat in je pipeline');rLeads()}
}
async function lfAddAll(){
  var todo=[];LEADS.forEach(function(l,i){if(l.score>=70&&!lfIsKnown(l))todo.push(i)});
  if(!todo.length){toast('Geen nieuwe rode leads');return}
  if(!confirm(todo.length+' leads toevoegen aan je pipeline?'))return;
  for(var k=0;k<todo.length;k++){await lfAdd(todo[k],true)}
  toast('\u2705 '+todo.length+' leads toegevoegd');rLeads();
}

</script>
