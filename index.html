<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marleo HQ, CRM & boekhouding</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080E;--bg2:#0D0D16;--panel:#12121D;--panel2:#171724;
  --line:rgba(255,255,255,.08);--text:#F4F4F8;--muted:#9C9CB2;
  --orange:#F97C1F;--red:#EF4056;--pink:#E91E7B;
  --grad:linear-gradient(100deg,var(--orange),var(--red) 50%,var(--pink));
  --green:#22C55E;--amber:#F5A623;--blue:#3B82F6;
  --disp:'Space Grotesk',sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}
::selection{background:var(--pink);color:#fff}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 13px;font-family:var(--body);font-size:.93rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(239,64,86,.15)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;font-weight:600;font-size:.9rem;padding:11px 20px;border-radius:11px;border:none;box-shadow:0 8px 24px -8px rgba(239,64,86,.55);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.subtle{background:var(--panel2);box-shadow:none;border:1px solid var(--line);color:var(--muted)}
.btn.subtle:hover{color:var(--text)}
.btn.danger{background:linear-gradient(100deg,#DC2626,#B91C1C)}
.btn.sm{padding:7px 14px;font-size:.82rem;border-radius:9px}
.hexsvg path{stroke:url(#mg)}

#loginView{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.25;pointer-events:none}
.orb.a{width:520px;height:520px;background:var(--orange);top:-160px;left:-140px}
.orb.b{width:460px;height:460px;background:var(--pink);bottom:-160px;right:-140px}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:44px 38px;position:relative;z-index:2;box-shadow:0 40px 100px -20px rgba(0,0,0,.8);animation:cardIn .6s cubic-bezier(.2,.8,.3,1.1)}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.login-card h1{font-family:var(--disp);font-size:1.4rem;text-align:center;letter-spacing:-.02em;margin:10px 0 4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:26px}
.login-err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.4);color:#FCA5A5;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:14px;display:none}
.login-err.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fgroup{margin-bottom:15px}

#appView{display:none;min-height:100vh}
#appView.active{display:grid;grid-template-columns:250px 1fr}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
aside .brand b{font-family:var(--disp);font-size:1.02rem}
.navmenu{display:grid;gap:3px;flex:1;align-content:start;overflow-y:auto}
.navmenu button{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--muted);padding:10px 13px;border-radius:10px;font-size:.9rem;font-weight:500;text-align:left;width:100%}
.navmenu button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.navmenu button.active{background:linear-gradient(100deg,rgba(249,124,31,.18),rgba(233,30,123,.18));color:#fff;position:relative}
.navmenu button.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--grad)}
.navmenu svg{width:18px;height:18px;flex-shrink:0}
.navsec{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 13px 5px}
.userbox{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:.85rem;flex-shrink:0}
.userbox .who{flex:1;min-width:0}
.userbox b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox span{font-size:.7rem;color:var(--muted)}
.userbox button{background:none;border:none;color:var(--muted);padding:5px}
.userbox button:hover{color:var(--red)}

main{padding:28px 32px 60px;max-width:1280px;width:100%}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.topbar h2{font-family:var(--disp);font-size:1.5rem;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:.87rem}
.searchbox{position:relative;width:min(280px,100%)}
.searchbox input{padding-left:36px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:rgba(233,30,123,.35)}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.stat.g::before{background:var(--green)}.stat.a::before{background:var(--amber)}.stat.r::before{background:#DC2626}
.stat .label{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.stat .val{font-family:var(--disp);font-size:1.65rem;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.stat .hint{font-size:.75rem;color:var(--muted);margin-top:2px}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px}
.panelbox h3{font-family:var(--disp);font-size:1rem;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.two-col{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.betaald{background:rgba(34,197,94,.14);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
.pill.openstaand{background:rgba(245,166,35,.14);color:#FCD34D;border:1px solid rgba(245,166,35,.35)}
.pill.vervallen{background:rgba(220,38,38,.16);color:#FCA5A5;border:1px solid rgba(220,38,38,.4)}
.pill.concept{background:rgba(156,156,178,.12);color:var(--muted);border:1px solid var(--line)}
.pill.lead{background:rgba(59,130,246,.15);color:#93C5FD;border:1px solid rgba(59,130,246,.35)}
.pill.actief{background:rgba(34,197,94,.14);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
.pill.inactief{background:rgba(156,156,178,.12);color:var(--muted);border:1px solid var(--line)}
.pill.open{background:rgba(245,166,35,.14);color:#FCD34D;border:1px solid rgba(245,166,35,.35)}
.pill.bezig{background:rgba(59,130,246,.15);color:#93C5FD;border:1px solid rgba(59,130,246,.35)}
.pill.klaar{background:rgba(34,197,94,.14);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
.pill.hoog{background:rgba(220,38,38,.14);color:#FCA5A5;border:1px solid rgba(220,38,38,.35)}
.pill.normaal{background:rgba(156,156,178,.12);color:var(--muted);border:1px solid var(--line)}
.rowactions{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:.85rem}
.iconbtn:hover{color:var(--text);border-color:rgba(233,30,123,.45)}
.iconbtn.del:hover{color:#FCA5A5;border-color:rgba(220,38,38,.5)}
.iconbtn.ok:hover{color:#86EFAC;border-color:rgba(34,197,94,.5)}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:.9rem}
.empty .big{font-size:1.9rem;display:block;margin-bottom:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:.83rem;font-weight:600}
.tab:hover{color:var(--text)}
.tab.active{background:var(--grad);color:#fff;border-color:transparent}
#chart{width:100%;height:210px}
.activity{list-style:none;display:grid;gap:1px;max-height:290px;overflow-y:auto}
.activity li{display:flex;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:.84rem;align-items:flex-start}
.activity li:last-child{border-bottom:none}
.activity .dot{width:7px;height:7px;border-radius:50%;background:var(--grad);margin-top:7px;flex-shrink:0}
.activity time{color:var(--muted);font-size:.7rem;font-family:var(--mono);display:block}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,5,10,.75);backdrop-filter:blur(6px);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:18px;max-width:680px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:cardIn .3s cubic-bezier(.2,.8,.3,1.1)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--disp);font-size:1.05rem}
.modal-close{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:33px;height:33px;border-radius:9px}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow3{display:grid;grid-template-columns:2.4fr .6fr .9fr auto;gap:10px;align-items:end;margin-bottom:10px}
.hint{font-size:.75rem;color:var(--muted);margin-top:5px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(24px);z-index:200;background:var(--panel2);border:1px solid rgba(34,197,94,.5);border-radius:13px;padding:12px 22px;font-size:.89rem;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 20px 50px -12px rgba(0,0,0,.7)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.warn{border-color:rgba(245,166,35,.6)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;font-size:.9rem;margin-bottom:18px}
.detail-grid .lbl{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono);margin-bottom:2px}
.totbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:14px}
.totline{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;color:var(--muted)}
.totline b{color:var(--text);font-variant-numeric:tabular-nums}
.totline.big{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:1.05rem}
.totline.big b{font-family:var(--disp);font-size:1.25rem}
.notecard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.notecard .meta{font-size:.7rem;color:var(--muted);font-family:var(--mono);margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}
.notecard p{font-size:.89rem;white-space:pre-wrap}
.bar{height:9px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad)}
.menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:70;background:var(--panel2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:12px;place-items:center}
@media (max-width:1000px){.stats{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}
@media (max-width:860px){
  #appView.active{grid-template-columns:1fr}
  aside{position:fixed;top:0;bottom:0;z-index:60;transition:left .3s}
  aside.open{left:0;box-shadow:30px 0 80px rgba(0,0,0,.6)}
  .menu-toggle{display:grid}
}

/* ============ MOBIEL: veel beter bruikbaar op gsm ============ */
@media (max-width:860px){
  /* menuknop groter en duimvriendelijk */
  /* harde containment: niks steekt buiten het scherm */
  #appView.active{overflow-x:hidden;max-width:100vw}
  main{max-width:100vw;overflow-x:hidden}
  main>*{max-width:100%}
  .topbar>div{max-width:100%}
  .topbar .searchbox,.topbar input{width:100%!important;max-width:100%}
  .topbar>div[style*="display:flex"]{flex-wrap:wrap;width:100%}
  /* de tabel-wrapper scrollt, main niet */
  .panelbox>div[style*="overflow"]{max-width:100%;overflow-x:auto}

  .menu-toggle{width:48px;height:48px;top:14px;left:14px;border-radius:14px}
  .menu-toggle svg{width:24px;height:24px}
  main{padding:74px 14px calc(90px + env(safe-area-inset-bottom))}
  /* topbar netjes onder elkaar */
  .topbar{flex-direction:column;gap:12px;margin-bottom:18px}
  .topbar h2{font-size:1.35rem}
  .topbar .btn{width:100%}
  /* knoppen groter voor vingers */
  .btn{padding:13px 20px;font-size:.95rem;min-height:46px}
  .btn.sm{padding:10px 16px!important;font-size:.86rem!important;min-height:40px}
  /* tabellen: horizontaal scrollbaar met momentum */
  .panelbox{padding:12px!important;border-radius:14px}
  table{font-size:.86rem;min-width:520px}
  .panelbox>div[style*="overflow"]{-webkit-overflow-scrolling:touch}
  th,td{padding:10px 8px!important}
  /* tabs scrollbaar in plaats van wrappen */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:6px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  /* formulieren: velden op volle breedte, grotere invoer */
  .frow,.frow3,.detail-grid,.custcols,.agwrap,.kanban,.docgrid,.tplgrid,.statgrid{grid-template-columns:1fr!important}
  input,select,textarea{font-size:16px!important;padding:12px 14px!important}
  .fgroup label{font-size:.82rem}
  /* modals passend op klein scherm */
  .modal{width:calc(100vw - 24px)!important;max-width:none!important;max-height:88vh;overflow-y:auto;margin:12px}
  .modal-backdrop{padding:0!important;align-items:flex-end}
  .modal{border-radius:20px 20px 0 0}
  .modal-foot{position:sticky;bottom:0;background:var(--panel);padding-top:12px}
  .modal-foot .btn{flex:1}
  /* kalender compacter */
  .agcell{min-height:56px;padding:3px}
  .agday{font-size:.7rem}
  .agchip{font-size:.6rem;padding:1px 3px}
  /* iconen-acties in rijen groter */
  .iconbtn{padding:8px 11px;font-size:1rem;min-width:40px;min-height:36px}
  .rowactions{gap:8px}
  /* statskaarten leesbaarder */
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .statcard,.kpi{padding:14px}
  /* dashboard 1 kolom */
  .two-col,.stats.wide{grid-template-columns:1fr}
  /* sidebar breder & items groter */
  aside{width:270px;left:-290px}
  #navmenu button{padding:13px 16px;font-size:.95rem}
  .navsec{font-size:.72rem;margin-top:14px}
  /* sluitknop portal onder handbereik weg (app-modus heeft hem toch niet) */
}
@media (max-width:560px){
  .stats{grid-template-columns:1fr}
  .topbar h2{font-size:1.2rem}
  main{padding:70px 12px 90px}
}
/* overal: vlottere scroll & geen horizontale overflow */
body{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:rgba(233,30,123,.15)}


.pipewrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.pipecol{min-width:215px;flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px}
.pipehead{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-size:.8rem;font-weight:600;padding:4px 6px 10px}
.pipesum{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.pipeempty{text-align:center;color:var(--muted);font-size:.8rem;padding:14px 0}
.dealcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:transform .12s,border-color .12s}
.dealcard:hover{transform:translateY(-2px);border-color:rgba(233,30,123,.4)}
.dealcard.late{border-color:rgba(245,166,35,.55)}
.dealcard b{font-family:var(--disp);font-size:.88rem}
.dmeta{font-size:.7rem;color:var(--muted);margin:2px 0 6px}
.drow{display:flex;justify-content:space-between;font-size:.75rem}
.drow .fok{color:var(--muted)}.drow .flate{color:#FCD34D;font-weight:700}

.syncbadge{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-family:var(--mono);color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;transition:border-color .2s}
.syncbadge:hover{border-color:rgba(233,30,123,.5);color:var(--text)}
.syncbadge.off{color:#FCA5A5}
.syncbadge .sdot{width:7px;height:7px;border-radius:50%;background:#86EFAC;box-shadow:0 0 8px #86EFAC}
.syncbadge .sdot.off{background:#FCA5A5;box-shadow:none}
.syncbadge .srefresh{font-size:.9rem;opacity:.7}

.taskpop{position:fixed;bottom:22px;right:22px;width:340px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.6),0 0 0 1px rgba(233,30,123,.15);z-index:400;overflow:hidden;animation:tpIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes tpIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.tp-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--grad);color:#fff;font-weight:700;font-size:.92rem;font-family:var(--disp)}
.tp-x{background:rgba(255,255,255,.2);border:none;color:#fff;width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:.8rem}
.tp-x:hover{background:rgba(255,255,255,.35)}
.tp-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.tp-item.hoog{background:rgba(239,64,86,.06)}
.tp-check{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid #86EFAC;background:transparent;color:#86EFAC;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .15s}
.tp-check:hover{background:#86EFAC;color:#08080E}
.tp-body{flex:1;min-width:0}
.tp-title{font-weight:600;font-size:.87rem;line-height:1.3;color:var(--text)}
.tp-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.tp-snooze{flex-shrink:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:.9rem}
.tp-snooze:hover{border-color:var(--orange)}
.tp-more{padding:8px 14px;font-size:.76rem;color:var(--muted);text-align:center}
.tp-all{width:100%;padding:11px;background:var(--panel2);border:none;border-top:1px solid var(--line);color:var(--text);font-weight:600;font-size:.83rem;cursor:pointer;font-family:var(--body)}
.tp-all:hover{background:var(--panel)}

.contactbar{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.contactbar .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

.cbadge{display:inline-block;font-size:.8rem;vertical-align:middle;margin-left:2px}
.dnext{font-size:.72rem;color:var(--muted);margin-top:4px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* ===== nieuwe modules ===== */
.empty .big{display:block;font-size:2.4rem;margin-bottom:8px}
.sm{padding:7px 14px!important;font-size:.82rem!important}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--muted);font-size:.9rem;transition:all .15s}
.iconbtn:hover{border-color:var(--red);color:var(--text)}
.iconbtn.del:hover{border-color:#ef4444;color:#ef4444}
.rowactions{display:flex;gap:6px;justify-content:flex-end}
/* agenda */
.agwrap{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:900px){.agwrap{grid-template-columns:1fr}}
.aghead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.aghead h3{flex:1;font-family:var(--disp);font-size:1.1rem}
.aggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.aghdr{margin-bottom:4px}
.agdow{text-align:center;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px}
.agcell{min-height:78px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;transition:border-color .15s;overflow:hidden}
.agcell:hover{border-color:var(--red)}
.agcell.empty{background:transparent;border:none;cursor:default}
.agcell.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.agday{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.agcell.today .agday{color:var(--red)}
.agchip{background:var(--grad);color:#fff;border-radius:5px;padding:2px 5px;font-size:.68rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.agmore{font-size:.66rem;color:var(--muted);padding-left:3px}
.agside h3{font-family:var(--disp);font-size:1rem;margin-bottom:12px}
.agitem{padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.agitem:hover{border-color:var(--red)}
.agitemd{font-size:.72rem;color:var(--red);font-weight:600}
.agitemt{font-weight:600;margin:2px 0}
.agitemc{font-size:.78rem;color:var(--muted)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.kcolh{font-weight:700;font-size:.9rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kcount{background:var(--panel);border-radius:999px;padding:1px 9px;font-size:.75rem;color:var(--muted)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:grab;transition:border-color .15s,transform .1s}
.kcard:hover{border-color:var(--red)}
.kcard:active{cursor:grabbing;transform:scale(.98)}
.kcardt{font-weight:600;font-size:.9rem}
.kcardc{font-size:.76rem;color:var(--muted);margin-top:3px}
.kcardd{font-size:.74rem;color:var(--muted);margin-top:3px}
.kprio{display:inline-block;margin-top:6px;background:rgba(239,68,68,.15);color:#ef4444;font-size:.68rem;padding:1px 8px;border-radius:999px;font-weight:600}
/* tijdregistratie stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.statcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.statlabel{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.statnum{font-family:var(--disp);font-size:1.4rem;font-weight:700}
/* e-mailsjablonen */
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tplcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tplh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tplsub{font-size:.82rem;color:var(--red);font-weight:600;margin-bottom:8px}
.tplbody{white-space:pre-wrap;font-family:var(--body);font-size:.82rem;color:var(--muted);background:var(--bg2);border-radius:8px;padding:10px;max-height:160px;overflow:auto;margin-bottom:10px;border:1px solid var(--line)}

.catpick{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 12px;font-size:.82rem;font-family:var(--body);cursor:pointer}
.dagstart{padding:2px 0}
.ds-head{margin-bottom:16px}
.ds-greet{font-family:var(--disp);font-size:1.4rem;font-weight:600}
.ds-date{color:var(--muted);font-size:.9rem;text-transform:capitalize;margin-top:2px}
.ds-money{display:flex;gap:10px;margin-bottom:18px}
.ds-m{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ds-ml{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.ds-mv{font-family:var(--disp);font-size:1.35rem;font-weight:600;margin-top:4px}
.ds-section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px 2px;font-weight:600}
.ds-row{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:transform .1s}
.ds-row:active{transform:scale(.98)}
.ds-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ds-tx{flex:1;line-height:1.3}
.ds-tx b{display:block;font-size:.95rem}
.ds-tx span{color:var(--muted);font-size:.82rem}
.ds-ct{font-family:var(--disp);font-size:1.5rem;font-weight:700;flex-shrink:0}
.ds-allgood{text-align:center;padding:24px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.ds-today{margin-top:18px}
.ds-sub{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px 2px;font-weight:600}
.ds-appt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-size:.92rem}
.ds-time{color:var(--orange);font-weight:600;font-family:var(--mono);margin-right:6px}
.ds-cust{color:var(--muted);font-size:.85rem}

.custhero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px}
.custav{width:64px;height:64px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:1.8rem;color:#fff;flex-shrink:0}
.custtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.custkpis{display:flex;gap:22px;flex-wrap:wrap}
.custkpis .val{font-family:var(--disp);font-size:1.4rem;font-weight:700}
.custcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:760px){.custcols{grid-template-columns:1fr}}

.docgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.docgrid{grid-template-columns:1fr}}
.doccard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;transition:border-color .2s,transform .2s}
.doccard:hover{border-color:rgba(233,30,123,.4);transform:translateY(-2px)}
.docicon{font-size:32px;margin-bottom:12px}
.doccard h3{font-family:var(--disp);font-size:1.15rem;margin-bottom:6px}
.doccard p{color:var(--muted);font-size:.9rem;line-height:1.55}
</style>
</head>

<script>
/* ============ CONFIG ============ */
var ADMIN_EMAIL="giannis@marleo.tech";
var ADMIN_HASH_DEFAULT="b846def1fc1f43648164cd84e24d5aea325c49643336258b6bd4f3d8338ec966";
var LS_KEY="marleo_hq_v1";var LS_OLD="marleo_crm_v2";
var VAT_RATE=0.21;

function coCfg(){DATA.settings=DATA.settings||{};if(!DATA.settings.company)DATA.settings.company={name:'Marleo',legal:'Marleo',vat:'BE 0751.641.419',address:'',zip:'',city:'',email:'info@marleo.tech',phone:'',iban:'',bic:'',website:'marleo.tech',pay:'overschrijving',deflang:'nl',terms:'Betaling binnen 14 dagen.'};var co=DATA.settings.company;if(!co.pay)co.pay='overschrijving';if(!co.deflang)co.deflang='nl';return co}


/* ============ SEED ============ */
function seedData(){
  return {customers:[],deals:[],invoices:[],expenses:[],tasks:[],notes:[],clients:[],appointments:[],products:[],timelogs:[],emailtemplates:[],activity:[{t:Date.now(),txt:'Welkom in Marleo HQ, koppel Airtable via Instellingen om je pipeline te laden'}],settings:{airtable:{token:'',base:'appqZHTc5zbx3hNSh',table:'tblU5dzzAenFL6qbp'},company:{name:'Marleo',legal:'Marleo',vat:'BE 0751.641.419',address:'',zip:'',city:'',email:'info@marleo.tech',phone:'',iban:'',bic:'',website:'marleo.tech',pay:'overschrijving',deflang:'nl',terms:'Betaling binnen 14 dagen. Bij laattijdige betaling is van rechtswege en zonder ingebrekestelling een verwijlintrest verschuldigd.'}},seq:{invoice:2026001}};
}

/* ============ STORAGE ============ */
var storageOK=true,memStore=null;
function loadData(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw){var old=localStorage.getItem(LS_OLD);if(old){raw=old}}
    if(raw){var d=JSON.parse(raw);if(!d.expenses)d.expenses=[];if(!d.deals)d.deals=[];if(!d.activitiesLog)d.activitiesLog=[];migrate(d);return d}
  }catch(e){storageOK=false}
  return memStore||seedData();
}
function migrate(d){
  d.customers.forEach(function(c){if(!c.type)c.type='klant';if(!c.tags)c.tags=[]});
  if(!d.deals)d.deals=[];
  if(!d.appointments)d.appointments=[];
  if(!d.products)d.products=[];
  if(!d.timelogs)d.timelogs=[];
  if(!d.emailtemplates)d.emailtemplates=[];
}
function saveData(){try{localStorage.setItem(LS_KEY,JSON.stringify(DATA))}catch(e){storageOK=false;memStore=DATA}}
var DATA=loadData();

/* ===== CLOUD SYNC (Supabase): alle gegevens centraal, overal dezelfde data ===== */
var SB_URL='https://ufzwdhbrmycjtlewstaw.supabase.co';
var SB_KEY='sb_publishable_iAw0wHhfPvYY1m1IBtJ91Q_NrTO61pa';
var sb=null;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.warn('Supabase niet geladen',e)}
var CLOUD={uid:null,hashes:{},lastPull:null,timer:null,pushTimer:null,busy:false};
function cloudCollections(){return Object.keys(DATA).filter(function(k){return k!=='lastSyncStats'})}
function cloudHash(v){return JSON.stringify(v)}
function cloudSetStatus(txt,warn){var el=document.getElementById('cloudStatus');if(el){el.textContent=txt;el.style.color=warn?'#FCA5A5':'#86EFAC'}}
async function cloudPull(initial){
  if(!sb||!CLOUD.uid||CLOUD.busy)return;CLOUD.busy=true;
  try{
    var q=sb.from('crm_state').select('collection,data,updated_at').eq('user_id',CLOUD.uid);
    if(CLOUD.lastPull&&!initial)q=q.gt('updated_at',CLOUD.lastPull);
    var r=await q;if(r.error)throw r.error;
    var rows=r.data||[],changed=false,newest=CLOUD.lastPull;
    if(initial&&!rows.length){
      /* eerste keer op dit account: lokale gegevens naar de cloud */
      var hasLocal=(DATA.customers||[]).length||(DATA.invoices||[]).length||(DATA.deals||[]).length;
      if(hasLocal){await cloudPushAll();toast('☁️ Lokale gegevens naar de cloud gezet')}
    }
    rows.forEach(function(row){
      var h=cloudHash(row.data);
      if(CLOUD.hashes[row.collection]!==h){DATA[row.collection]=row.data;CLOUD.hashes[row.collection]=h;changed=true}
      if(!newest||row.updated_at>newest)newest=row.updated_at;
    });
    if(newest)CLOUD.lastPull=newest;
    if(changed){migrate(DATA);try{localStorage.setItem(LS_KEY,JSON.stringify(DATA))}catch(e){}
      if(!initial){toast('☁️ Bijgewerkt vanaf een ander toestel');if(typeof VIEW!=='undefined'&&VIEW&&!document.querySelector('.modal-backdrop.open'))go(VIEW)}}
    cloudSetStatus('☁️ Gesynchroniseerd '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){cloudSetStatus('Sync-fout: '+(e.message||e),true)}
  CLOUD.busy=false;
}
async function cloudPushAll(){cloudCollections().forEach(function(k){CLOUD.hashes[k]=null});await cloudPushChanged()}
async function cloudPushChanged(){
  if(!sb||!CLOUD.uid)return;
  var rows=[];cloudCollections().forEach(function(k){var h=cloudHash(DATA[k]);if(CLOUD.hashes[k]!==h){rows.push({user_id:CLOUD.uid,collection:k,data:DATA[k],updated_at:new Date().toISOString()});CLOUD.hashes[k]=h}});
  if(!rows.length)return;
  try{var r=await sb.from('crm_state').upsert(rows,{onConflict:'user_id,collection'});if(r.error)throw r.error;
    CLOUD.lastPull=rows[0].updated_at;cloudSetStatus('☁️ Opgeslagen '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){rows.forEach(function(x){CLOUD.hashes[x.collection]=null});cloudSetStatus('Opslaan mislukt: '+(e.message||e),true)}
}
function cloudSchedulePush(){if(!CLOUD.uid)return;clearTimeout(CLOUD.pushTimer);CLOUD.pushTimer=setTimeout(cloudPushChanged,800)}
function cloudStart(){
  clearInterval(CLOUD.timer);CLOUD.timer=setInterval(function(){cloudPull(false)},20000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')cloudPull(false)});
  window.addEventListener('beforeunload',function(){cloudPushChanged()});
}
/* saveData uitbreiden: lokaal + cloud */
var _saveDataLocal=saveData;
saveData=function(){_saveDataLocal();cloudSchedulePush()};

/* ===== Login via Supabase Auth (admin) ===== */
async function cloudLogin(mail,pass){
  if(!sb)return {error:'Verbinding met de cloud mislukt. Herlaad de pagina.'};
  var r=await sb.auth.signInWithPassword({email:mail,password:pass});
  if(!r.error)return {user:r.data.user};
  if(/invalid login/i.test(r.error.message))return {error:'Ongeldig e-mailadres of wachtwoord.'};
  if(/email not confirmed/i.test(r.error.message))return {error:'Bevestig eerst de e-mail die naar '+mail+' is gestuurd.'};
  return {error:r.error.message};
}
async function cloudEnter(user){
  CLOUD.uid=user.id;SESSION={role:'admin',name:'Giannis',email:user.email};
  await cloudPull(true);cloudStart();enterApp();
}
async function cloudChangePassword(np){if(!sb)return;var r=await sb.auth.updateUser({password:np});if(r.error)toast(r.error.message,true);else toast('✅ Wachtwoord gewijzigd')}

function nid(p){DATA.seq=(DATA.seq||1)+1;return (p||'id')+Date.now().toString(36)+DATA.seq}
function logAct(t){DATA.activity.unshift({t:Date.now(),txt:t});DATA.activity=DATA.activity.slice(0,80);saveData()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function eur(n){return '\u20AC '+Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(s){if(!s)return ', ';var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function today(){return new Date().toISOString().slice(0,10)}
var toastT;function toast(m,w){var t=document.getElementById('toast');t.textContent=m;t.classList.toggle('warn',!!w);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},3000)}

/* ============ INVOICE MATH ============ */
function invSub(iv){return iv.lines.reduce(function(s,l){return s+Math.round(l.q*l.p*100)/100},0)}
function invVat(iv){return Math.round(invSub(iv)*VAT_RATE*100)/100}
function invTot(iv){return Math.round((invSub(iv)+invVat(iv))*100)/100}
function invStatus(iv){
  if(iv.status==='betaald')return 'betaald';
  if(iv.status==='concept')return 'concept';
  if(iv.due&&iv.due<today())return 'vervallen';
  return 'openstaand';
}
function custName(id){var c=DATA.customers.find(function(x){return x.id===id});return c?c.name:', '}
function customer(id){return DATA.customers.find(function(x){return x.id===id})}
function nextRef(type){
  type=type||'factuur';
  var prefix=type==='offerte'?'OFF':'FACT';
  var yr=new Date().getFullYear();
  var nums=DATA.invoices.filter(function(i){return (i.type||'factuur')===type}).map(function(i){var m=/(\d+)\s*$/.exec(i.ref||'');return m?parseInt(m[1],10):0});
  var mx=nums.length?Math.max.apply(null,nums):0;
  return prefix+'-'+yr+'-'+String(mx+1).padStart(4,'0');
}

/* ============ AUTH ============ */
var SESSION=null;
async function sha256(str){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
document.getElementById('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  var mail=document.getElementById('lmail').value.trim().toLowerCase(),pass=document.getElementById('lpass').value;
  var err=document.getElementById('loginErr');err.classList.remove('show');
  var h;try{h=await sha256(pass)}catch(x){err.textContent="Inloggen vereist een https-verbinding.";err.classList.add('show');return}
  if(mail===ADMIN_EMAIL){var btn=this.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Inloggen\u2026'}
    var res=await cloudLogin(mail,pass);
    if(res.user){await cloudEnter(res.user);return}
    if(btn){btn.disabled=false;btn.textContent='Inloggen'}
    err.textContent=res.error||'Inloggen mislukt';err.classList.add('show');return}
  var cl=DATA.clients.find(function(c){return c.email.toLowerCase()===mail&&c.hash===h});
  if(cl){SESSION={role:'client',name:cl.name,email:cl.email,customerId:cl.customerId};enterApp();return}
  err.textContent="Ongeldig e-mailadres of wachtwoord.";err.classList.add('show');
});
// ===== Onthoud mij (30 dagen) =====
var REMEMBER_KEY='marleo_remember';
function rememberSession(){
  try{
    var tok={email:SESSION.email,exp:Date.now()+30*864e5};
    localStorage.setItem(REMEMBER_KEY,JSON.stringify(tok));
  }catch(e){}
}

/* ===== DAGSTART: overzicht bij openen van de app ===== */
var DAGSTART_KEY='marleo_dagstart_seen';
function daysBetween(iso){ if(!iso)return null; var d=new Date(iso+'T00:00:00'); var n=new Date(today()+'T00:00:00'); return Math.round((n-d)/86400000); }
function dagstartData(){
  var t=today();
  var nowM=t.slice(0,7);
  // Facturen te laat (vervallen, niet betaald)
  var overdue=DATA.invoices.filter(function(iv){return invStatus(iv)==='vervallen'});
  var overdueSum=overdue.reduce(function(s,iv){return s+invTot(iv)},0);
  // Openstaand (verstuurd, nog niet betaald, nog niet vervallen)
  var openInv=DATA.invoices.filter(function(iv){return invStatus(iv)==='openstaand'});
  var openSum=openInv.reduce(function(s,iv){return s+invTot(iv)},0);
  // Taken vandaag of te laat (niet afgevinkt)
  var tasksDue=DATA.tasks.filter(function(x){return !x.done && x.due && x.due<=t});
  var tasksToday=DATA.tasks.filter(function(x){return !x.done && x.due===t});
  // Afspraken vandaag
  var apptToday=(DATA.appointments||[]).filter(function(a){return a.date===t});
  // Deals met follow-up die vervallen is
  var followDue=DATA.deals.filter(function(d){return d.follow&&d.follow<=t&&d.stage!=='gewonnen'&&d.stage!=='verloren'});
  // Website-aanvragen die nog niet opgevolgd zijn
  var webLeads=DATA.deals.filter(function(d){return (d.kanaal==='Website'||(d.cat||'').toLowerCase().indexOf('website')>=0)&&d.stage!=='gewonnen'&&d.stage!=='verloren'});
  // Offertes die openstaan (quotes / concept-facturen van type offerte)
  var quotes=DATA.invoices.filter(function(iv){return (iv.type==='offerte'||iv.type==='quote')&&iv.status!=='betaald'&&iv.status!=='geweigerd'});
  // Omzet deze maand (betaalde facturen met datum in deze maand)
  var revMonth=DATA.invoices.filter(function(iv){return iv.status==='betaald'&&(iv.date||'').slice(0,7)===nowM}).reduce(function(s,iv){return s+invTot(iv)},0);
  // Klanten die lang niet gecontacteerd zijn (>45 dagen sinds laatste contact/aanmaak)
  var stale=[];
  DATA.customers.forEach(function(c){
    if(c.status==='inactief')return;
    // gebruik lastContact als het bestaat, anders created (beide zijn timestamps)
    var ref=c.lastContact||c.created||null;
    if(!ref)return;
    var days=Math.round((Date.now()-ref)/86400000);
    if(days>=45)stale.push({c:c,days:days});
  });
  stale.sort(function(a,b){return b.days-a.days});
  return {overdue:overdue,overdueSum:overdueSum,openInv:openInv,openSum:openSum,tasksDue:tasksDue,tasksToday:tasksToday,apptToday:apptToday,followDue:followDue,webLeads:webLeads,quotes:quotes,revMonth:revMonth,stale:stale};
}
function dagstartHTML(d){

function tryAutoLogin(){
  if(sb){sb.auth.getSession().then(function(r){if(r.data&&r.data.session){cloudEnter(r.data.session.user)}});return true}
  try{
    var raw=localStorage.getItem(REMEMBER_KEY);
    if(!raw)return false;
    var tok=JSON.parse(raw);
    if(!tok||!tok.exp||Date.now()>tok.exp){localStorage.removeItem(REMEMBER_KEY);return false;}
    if(tok.email===ADMIN_EMAIL){
      SESSION={role:'admin',name:'Giannis',email:tok.email};

  }catch(e){}

function drawChart(){
  var cv=document.getElementById('chart');if(!cv)return;
  var ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=420;cv.style.height='210px';
  var now=new Date(),labels=[],vals=[];
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    labels.push(d.toLocaleDateString('nl-BE',{month:'short'}));
    var sum=0;
    DATA.invoices.forEach(function(iv){
      if(iv.status==='concept'||!iv.date)return;
      var dd=new Date(iv.date);
      if(dd.getMonth()===d.getMonth()&&dd.getFullYear()===d.getFullYear())sum+=invSub(iv);
    });
    vals.push(sum);
  }
  var max=Math.max.apply(null,vals.concat([1])),pad=46,bw=(W-pad*2)/6*.5;
  ctx.font='22px IBM Plex Mono';ctx.textAlign='center';
  for(var j=0;j<6;j++){
    var x=pad+(W-pad*2)/6*(j+.5),h=(H-110)*(vals[j]/max),y=H-64-h;
    var g=ctx.createLinearGradient(0,y,0,H-64);g.addColorStop(0,'#E91E7B');g.addColorStop(1,'#F97C1F');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-bw/2,y,bw,Math.max(h,4),8);ctx.fill();
    ctx.fillStyle='#9C9CB2';ctx.fillText(labels[j],x,H-26);
    if(vals[j]>0){ctx.fillStyle='#F4F4F8';ctx.fillText('\u20AC'+Math.round(vals[j]).toLocaleString('nl-BE'),x,y-14)}
  }
}

}
function unpayInv(id){
  var iv=DATA.invoices.find(function(x){return x.id===id});
  iv.status='openstaand';iv.paidDate=null;

function delInv(id){
  var iv=DATA.invoices.find(function(x){return x.id===id});

  DATA.invoices=DATA.invoices.filter(function(x){return x.id!==id});

function addLine(){EDITLINES.push({d:'',q:1,p:0});renderLines()}
function addFromCatalog(pid){if(!pid)return;var p=DATA.products.find(function(x){return x.id===pid});if(!p)return;
  // vervang lege eerste lijn, anders toevoegen
  if(EDITLINES.length===1&&!EDITLINES[0].d&&!EDITLINES[0].p){EDITLINES[0]={d:p.name+(p.desc?' \u2013 '+p.desc:''),q:1,p:p.price};}
  else{EDITLINES.push({d:p.name+(p.desc?' \u2013 '+p.desc:''),q:1,p:p.price});}

  var sub=EDITLINES.reduce(function(s,l){return s+Math.round((l.q||0)*(l.p||0)*100)/100},0);
  var vat=Math.round(sub*VAT_RATE*100)/100;
  var el=document.getElementById('i_tot');if(!el)return;
  el.innerHTML='<div class="totline"><span>Subtotaal excl. btw</span><b>'+eur(sub)+'</b></div><div class="totline"><span>BTW 21%</span><b>'+eur(vat)+'</b></div><div class="totline big"><span>Totaal</span><b class="gtext">'+eur(sub+vat)+'</b></div>';

  doc.text(T.subtot,tlx,y); doc.setTextColor(dark[0],dark[1],dark[2]); doc.text(money(sub),trx,y,{align:'right'});
  y+=6.5; doc.setTextColor(grey[0],grey[1],grey[2]); doc.text(T.btw,tlx,y);

    else if(pay==='anders')payLines=T.payOther(money(tot));
    else if(co.iban)payLines=T.payOver(money(tot),co.iban,co.bic||'',iv.ref);
    else payLines=['',''];
  }
  if(payLines&&(payLines[0]||payLines[1])){
    doc.setFillColor(light[0],light[1],light[2]); doc.roundedRect(M,y-6,W-2*M,22,2,2,'F');
    doc.setFillColor(pink[0],pink[1],pink[2]); doc.roundedRect(M,y-6,1.5,22,0.7,0.7,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text(isOff?'':T.betaaltitel,M+6,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(grey[0],grey[1],grey[2]);
    if(payLines[0])doc.text(payLines[0],M+6,y+(isOff?0:5.5));

  if(iv.note){

  doc.text(footInfo.join('  ·  '),W/2,289.5,{align:'center'});

  doc.save(T.doc+'-'+(iv.ref||'document')+'.pdf');
  logAct('PDF gemaakt: '+T.doc+' '+iv.ref);
}

function autoVat(){
  var a=parseFloat(document.getElementById('e_amt').value)||0;

}
function saveExpense(id){
  var sup=document.getElementById('e_sup').value.trim();
  if(!sup){toast('Leverancier is verplicht',true);return}
  var o={supplier:sup,date:document.getElementById('e_date').value,desc:document.getElementById('e_desc').value.trim(),
    cat:document.getElementById('e_cat').value,amount:parseFloat(document.getElementById('e_amt').value)||0,vat:parseFloat(document.getElementById('e_vat').value)||0};
  if(id){Object.assign(DATA.expenses.find(function(x){return x.id===id}),o)}
  else{o.id=nid('exp');DATA.expenses.push(o);logAct('Uitgave geregistreerd: '+sup+' ('+eur(o.amount)+')')}
  saveData();closeM();toast('Uitgave opgeslagen');go('expenses');
}
function delExpense(id){
  if(!confirm('Uitgave verwijderen?'))return;
  DATA.expenses=DATA.expenses.filter(function(x){return x.id!==id});saveData();go('expenses');
}

/* ============ BTW ============ */
function quarterOf(d){return Math.floor(new Date(d).getMonth()/3)+1}
function rVat(){
  var year=new Date().getFullYear(),rows=[];
  for(var q=1;q<=4;q++){
    var outV=0,inV=0,outB=0,inB=0;
    DATA.invoices.forEach(function(iv){
      if(iv.status==='concept'||!iv.date)return;
      if(new Date(iv.date).getFullYear()!==year||quarterOf(iv.date)!==q)return;
      outB+=invSub(iv);outV+=invVat(iv);
    });
    DATA.expenses.forEach(function(e){
      if(!e.date||new Date(e.date).getFullYear()!==year||quarterOf(e.date)!==q)return;
      inB+=Number(e.amount||0);inV+=Number(e.vat||0);
    });
    rows.push({q:q,outB:outB,outV:outV,inB:inB,inV:inV,saldo:outV-inV});
  }
  var cq=quarterOf(today()),cur=rows[cq-1];
  main().innerHTML=
  '<div class="topbar"><div><h2>BTW-overzicht '+year+'</h2><div class="sub">Per kwartaal, handig voor je btw-aangifte</div></div></div>'+
  '<div class="stats">'+
   '<div class="stat"><div class="label">BTW op verkopen (Q'+cq+')</div><div class="val gtext">'+eur(cur.outV)+'</div><div class="hint">omzet '+eur(cur.outB)+'</div></div>'+
   '<div class="stat g"><div class="label">Aftrekbare btw (Q'+cq+')</div><div class="val" style="color:#86EFAC">'+eur(cur.inV)+'</div><div class="hint">kosten '+eur(cur.inB)+'</div></div>'+
   '<div class="stat a"><div class="label">Te betalen (Q'+cq+')</div><div class="val" style="color:#FCD34D">'+eur(Math.max(cur.saldo,0))+'</div><div class="hint">saldo btw</div></div>'+
   '<div class="stat r"><div class="label">Jaartotaal te betalen</div><div class="val">'+eur(rows.reduce(function(s,r){return s+Math.max(r.saldo,0)},0))+'</div><div class="hint">'+year+'</div></div>'+
  '</div>'+
  '<div class="panelbox"><h3>Per kwartaal</h3><div style="overflow-x:auto"><table><thead><tr><th>Kwartaal</th><th class="num">Omzet excl.</th><th class="num">BTW verkopen</th><th class="num">Kosten excl.</th><th class="num">BTW aankopen</th><th class="num">Saldo</th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr style="cursor:default"><td><b>Q'+r.q+'</b>'+(r.q===cq?' <span class="pill open">huidig</span>':'')+'</td><td class="num">'+eur(r.outB)+'</td><td class="num">'+eur(r.outV)+'</td><td class="num">'+eur(r.inB)+'</td><td class="num">'+eur(r.inV)+'</td><td class="num"><b>'+eur(r.saldo)+'</b></td></tr>'}).join('')+
  '</tbody></table></div><div class="hint" style="margin-top:12px">Let op: dit is een hulpmiddel, geen offici\u00EBle aangifte. Stem af met je boekhouder, bepaalde kosten zijn maar deels aftrekbaar.</div></div>';
}

function rReports(){
  var year=new Date().getFullYear();
  var omzet=0,kosten=0;
  DATA.invoices.forEach(function(iv){if(iv.status!=='concept'&&iv.date&&new Date(iv.date).getFullYear()===year)omzet+=invSub(iv)});
  DATA.expenses.forEach(function(e){if(e.date&&new Date(e.date).getFullYear()===year)kosten+=Number(e.amount||0)});
  var perCust={};
  DATA.invoices.forEach(function(iv){if(iv.status==='concept')return;var k=custName(iv.customerId);perCust[k]=(perCust[k]||0)+invSub(iv)});
  var top=Object.keys(perCust).map(function(k){return[k,perCust[k]]}).sort(function(a,b){return b[1]-a[1]});
  var maxv=top.length?top[0][1]:1;
  main().innerHTML=
  '<div class="topbar"><div><h2>Rapporten '+year+'</h2><div class="sub">Omzet, kosten en resultaat</div></div></div>'+
  '<div class="stats">'+
   '<div class="stat"><div class="label">Omzet excl. btw</div><div class="val gtext">'+eur(omzet)+'</div></div>'+
   '<div class="stat a"><div class="label">Kosten excl. btw</div><div class="val" style="color:#FCD34D">'+eur(kosten)+'</div></div>'+
   '<div class="stat g"><div class="label">Brutowinst</div><div class="val" style="color:#86EFAC">'+eur(omzet-kosten)+'</div></div>'+
   '<div class="stat"><div class="label">Gem. factuurbedrag</div><div class="val">'+eur(DATA.invoices.length?omzet/DATA.invoices.length:0)+'</div></div>'+
  '</div>'+
  '<div class="panelbox"><h3>Omzet per maand</h3><canvas id="chart"></canvas></div>'+
  '<div class="panelbox"><h3>Omzet per klant</h3>'+(top.length?top.map(function(t){
    return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:.88rem"><span>'+esc(t[0])+'</span><b>'+eur(t[1])+'</b></div><div class="bar"><i style="width:'+Math.round(t[1]/maxv*100)+'%"></i></div></div>';

  drawChart();
}

/* ============ AGENDA / AFSPRAKEN ============ */
var AGMONTH=null;
function rAgenda(){
  if(!AGMONTH){var n=new Date();AGMONTH={y:n.getFullYear(),m:n.getMonth()};}
  var y=AGMONTH.y,m=AGMONTH.m;
  var maanden=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  var first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var today=new Date();var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var appts=DATA.appointments.slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});
  function apptsOn(ds){return appts.filter(function(a){return a.date===ds});}
  var cells='';
  for(var i=0;i<start;i++)cells+='<div class="agcell empty"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var da=apptsOn(ds);
    cells+='<div class="agcell'+(ds===todayStr?' today':'')+'" onclick="mAppt(null,\''+ds+'\')">'+
      '<div class="agday">'+d+'</div>'+
      da.slice(0,3).map(function(a){return '<div class="agchip" onclick="event.stopPropagation();mAppt(\''+a.id+'\')" title="'+esc(a.title)+'">'+esc(a.time||'')+' '+esc(a.title)+'</div>';}).join('')+
      (da.length>3?'<div class="agmore">+'+(da.length-3)+' meer</div>':'')+'</div>';
  }
  var upcoming=appts.filter(function(a){return a.date>=todayStr}).slice(0,6);
  main().innerHTML=
  '<div class="topbar"><div><h2>Agenda</h2><div class="sub">Je afspraken en planning</div></div>'+
  '<button class="btn" onclick="mAppt()">+ Afspraak</button></div>'+
  '<div class="agwrap"><div class="agcal panelbox">'+
  '<div class="aghead"><button class="iconbtn" onclick="agNav(-1)">\u2039</button><h3>'+maanden[m]+' '+y+'</h3><button class="iconbtn" onclick="agNav(1)">\u203A</button><button class="btn subtle sm" onclick="AGMONTH=null;rAgenda()">Vandaag</button></div>'+
  '<div class="aggrid aghdr">'+['ma','di','wo','do','vr','za','zo'].map(function(x){return '<div class="agdow">'+x+'</div>';}).join('')+'</div>'+
  '<div class="aggrid">'+cells+'</div></div>'+
  '<div class="agside panelbox"><h3>Komende afspraken</h3>'+
  (upcoming.length?upcoming.map(function(a){return '<div class="agitem" onclick="mAppt(\''+a.id+'\')"><div class="agitemd">'+fmtD(a.date)+(a.time?' \u00b7 '+esc(a.time):'')+'</div><div class="agitemt">'+esc(a.title)+'</div>'+(a.customerId?'<div class="agitemc">'+esc(custName(a.customerId))+'</div>':'')+'</div>';}).join(''):'<p class="empty" style="padding:16px">Geen komende afspraken.</p>')+
  '</div></div>';
}
function agNav(dir){AGMONTH.m+=dir;if(AGMONTH.m<0){AGMONTH.m=11;AGMONTH.y--;}if(AGMONTH.m>11){AGMONTH.m=0;AGMONTH.y++;}rAgenda();}
function mAppt(id,presetDate){
  var a=id?DATA.appointments.find(function(x){return x.id===id}):{title:'',date:presetDate||'',time:'',customerId:'',note:''};
  var custOpts='<option value="">,  geen klant , </option>'+DATA.customers.map(function(c){return '<option value="'+c.id+'"'+(a.customerId===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');
  openM(id?'Afspraak bewerken':'Nieuwe afspraak',

function quoteToInvoice(id){
  var q=DATA.invoices.find(function(x){return x.id===id});if(!q)return;
  if(!confirm('Deze offerte omzetten naar een factuur? De offerte blijft bestaan.'))return;
  var seq=(DATA.seq=(DATA.seq||2026001)+1);
  var ref='FACT-'+new Date().getFullYear()+'-'+String(seq).slice(-4);
  var today=new Date();var ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var due=new Date(today.getTime()+14*864e5);var dds=due.getFullYear()+'-'+String(due.getMonth()+1).padStart(2,'0')+'-'+String(due.getDate()).padStart(2,'0');
  DATA.invoices.push({id:nid('inv'),ref:ref,type:'factuur',lang:q.lang||'nl',customerId:q.customerId,date:ds,due:dds,status:'openstaand',lines:JSON.parse(JSON.stringify(q.lines)),note:'',yourref:q.yourref||''});
  logAct('Offerte '+q.ref+' omgezet naar factuur '+ref);
  saveData();toast('Factuur '+ref+' aangemaakt');go('invoices');
}

function rTimetrack(){
  var logs=DATA.timelogs.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var totMin=logs.reduce(function(s,l){return s+(l.minutes||0);},0);
  var byC={};logs.forEach(function(l){var k=l.customerId||'_';byC[k]=(byC[k]||0)+(l.minutes||0);});
  function hm(min){return Math.floor(min/60)+'u '+(min%60)+'m';}
  main().innerHTML=
  '<div class="topbar"><div><h2>Tijdregistratie</h2><div class="sub">Totaal geregistreerd: '+hm(totMin)+'</div></div>'+
  '<button class="btn" onclick="mTimelog()">+ Uren loggen</button></div>'+
  (Object.keys(byC).length?'<div class="statgrid">'+Object.keys(byC).map(function(k){return '<div class="statcard"><div class="statlabel">'+(k==='_'?'Zonder klant':esc(custName(k)))+'</div><div class="statnum">'+hm(byC[k])+'</div></div>';}).join('')+'</div>':'')+
  '<div class="panelbox" style="padding:8px 12px;margin-top:14px">'+
  (logs.length?'<div style="overflow-x:auto"><table><thead><tr><th>Datum</th><th>Klant</th><th>Omschrijving</th><th>Duur</th><th></th></tr></thead><tbody>'+
    logs.map(function(l){return '<tr style="cursor:default"><td>'+fmtD(l.date)+'</td><td>'+(l.customerId?esc(custName(l.customerId)):'\u2014')+'</td><td>'+esc(l.desc||'')+'</td><td>'+hm(l.minutes||0)+'</td>'+
    '<td><div class="rowactions"><button class="iconbtn del" onclick="delTimelog(\''+l.id+'\')">\uD83D\uDDD1</button></div></td></tr>';}).join('')+
    '</tbody></table></div>':'<div class="empty"><span class="big">\u23F1\uFE0F</span>Nog geen uren geregistreerd.</div>')+'</div>';
}
function mTimelog(){
  var today=new Date();var ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var custOpts='<option value="">\u2014 geen klant \u2014</option>'+DATA.customers.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');
  openM('Uren loggen',
    '<div class="frow"><div class="fgroup"><label>Datum</label><input id="tl_date" type="date" value="'+ds+'"></div>'+
    '<div class="fgroup"><label>Duur (minuten)</label><input id="tl_min" type="number" step="15" value="60"></div></div>'+
    '<div class="fgroup"><label>Klant</label><select id="tl_cust">'+custOpts+'</select></div>'+
    '<div class="fgroup"><label>Omschrijving</label><input id="tl_desc" placeholder="waaraan gewerkt?"></div>',
    '<button class="btn subtle" onclick="closeM()">Annuleren</button><button class="btn" onclick="saveTimelog()">Opslaan</button>');
}
function saveTimelog(){
  var min=parseInt(document.getElementById('tl_min').value)||0;
  if(min<=0){toast('Geef een geldige duur op',true);return}
  DATA.timelogs.push({id:nid('tl'),date:document.getElementById('tl_date').value,minutes:min,customerId:document.getElementById('tl_cust').value,desc:document.getElementById('tl_desc').value.trim()});
  saveData();closeM();rTimetrack();toast('Uren geregistreerd');

function testSWNotif(){
  // test of de service worker ZELF een melding kan tonen (isoleert push-aflevering van worker-probleem)
  try{
    var w = (window.parent && window.parent!==window) ? window.parent : window;
    if(!('serviceWorker' in w.navigator)){ toast('Geen service worker op dit toestel',true); return; }
    w.navigator.serviceWorker.ready.then(function(reg){
      // methode 1: rechtstreeks via registration.showNotification
      if(reg && reg.showNotification){
        reg.showNotification('Marleo directe test', {
          body: 'Als je DIT ziet, werkt de melding-weergave. Dan ligt het aan de push-aflevering.',
          tag: 'marleo-directtest-'+Date.now(),
          data: { url: './?app=1' }
        }).then(function(){ toast('Testmelding verstuurd via worker'); }).catch(function(e){ toast('Worker-fout: '+e.message,true); });
      }
      // methode 2: ook via postMessage (voor het geval showNotification hier niet mag)
      if(reg && reg.active){ reg.active.postMessage({type:'MARLEO_TEST_NOTIF'}); }
    }).catch(function(e){ toast('Worker niet klaar: '+e.message,true); });
  }catch(e){ toast('Fout: '+e.message,true); }
}
function askNotifPermission(){
  if(!('Notification' in window)){toast('Meldingen niet ondersteund op dit toestel',true);return;}
  var topw=window.parent||window;
  var enableFn=(topw!==window && typeof topw.marleoEnablePush==='function')?topw.marleoEnablePush:(typeof window.marleoEnablePush==='function'?window.marleoEnablePush:null);
  if(!enableFn){
    // geen OneSignal beschikbaar: val terug op alleen in-app meldingen
    Notification.requestPermission().then(function(perm){
      if(perm==='granted'){toast('Meldingen ingeschakeld \u2713');DATA.settings.notifsOn=true;saveData();checkNotifs();}
      else{toast('Meldingen geweigerd',true);}
    });
    return;
  }
  // Roep de volledige push-flow aan (native prompt + OneSignal). Dit MOET direct vanuit de tik lopen.
  toast('Meldingen instellen...');
  var res=enableFn();
  // enableFn is async; toon het log-venster als het klaar is (of na max 12s)
  function toonLog(){
    try{
      var log=(topw&&typeof topw.marleoPushLog==='function')?topw.marleoPushLog():'(geen log)';
      var okGelukt=/GELUKT/i.test(log);
      if(okGelukt){DATA.settings.notifsOn=true;saveData();checkNotifs();}
      openM('Meldingen - status',
        '<div style="line-height:1.6"><p><b>'+(okGelukt?'\u2705 Gelukt!':'Status:')+'</b></p>'+
        '<div style="background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:monospace;font-size:.8rem;word-break:break-word;white-space:pre-wrap">'+esc(String(log))+'</div>'+
        (okGelukt?'<p style="margin-top:12px;color:#22C55E;font-size:.85rem">Je ontvangt nu meldingen, ook als de app dicht is.</p>':'<p style="margin-top:12px;color:var(--muted);font-size:.85rem">Werkt het niet? Maak een screenshot van deze tekst en stuur ze door.</p>')+'</div>',
        '<button class="btn" onclick="closeM()">OK</button>');
    }catch(e){}
  }
  if(res && typeof res.then==='function'){ res.then(function(){setTimeout(toonLog,500);}); }
  else { setTimeout(toonLog,9000); }
}
function notifShow(title,body,tag){
  if(NOTIF_SEEN[tag])return;
  NOTIF_SEEN[tag]=Date.now();
  // in-app toast altijd
  toast(title+' \u2013 '+body);
  // systeemmelding indien toegestaan
  try{
    if('Notification' in window && Notification.permission==='granted'){
      var n=new Notification(title,{body:body,tag:tag,icon:MARLEO_ICON,badge:MARLEO_ICON});
      n.onclick=function(){window.focus();n.close();};
    }
  }catch(e){}
  // geluidje
  try{ notifBeep(); }catch(e){}
}
function notifBeep(){
  var ctx=new (window.AudioContext||window.webkitAudioContext)();
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.frequency.value=880;o.type='sine';
  g.gain.setValueAtTime(0.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.4);
  o.start();o.stop(ctx.currentTime+0.4);
}
function checkNotifs(){
  if(SESSION&&SESSION.role!=='admin')return;
  var now=new Date();
  var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var lead=(DATA.settings&&DATA.settings.notifLead)||30; // minuten vooraf
  // afspraken vandaag binnen 'lead' minuten
  (DATA.appointments||[]).forEach(function(a){
    if(a.date!==todayStr||!a.time)return;
    var parts=a.time.split(':');
    var at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parseInt(parts[0]),parseInt(parts[1]));
    var diffMin=(at-now)/60000;
    if(diffMin>0 && diffMin<=lead){
      notifShow('Afspraak binnenkort',a.title+' om '+a.time+(a.customerId?' ('+custName(a.customerId)+')':''),'appt-'+a.id+'-'+todayStr);
    }
  });
  // taken die vandaag vervallen (1x per dag melden, 's ochtends bij openen)
  (DATA.tasks||[]).forEach(function(t){
    if(t.done||!t.due)return;
    if(t.due===todayStr){
      notifShow('Taak vervalt vandaag',t.title,'task-'+t.id+'-'+todayStr);
    } else if(t.due<todayStr){
      notifShow('Taak is te laat',t.title+' (deadline '+fmtD(t.due)+')','taskoverdue-'+t.id+'-'+todayStr);
    }
  });
}

async function changePw(){
  var a=document.getElementById('s_pw1').value,b=document.getElementById('s_pw2').value;
  if(a.length<8){toast('Minstens 8 tekens',true);return}
  if(a!==b){toast('Wachtwoorden komen niet overeen',true);return}
  DATA.adminHash=await sha256(a);saveData();await cloudChangePassword(a);
  document.getElementById('s_pw1').value='';document.getElementById('s_pw2').value='';
}

async function saveClient(){

function delClient(id){DATA.clients=DATA.clients.filter(function(x){return x.id!==id});saveData();go('settings')}
function exportData(){
  var blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marleo-boekhouding-'+today()+'.json';a.click();toast('Back-up gedownload');
}
function exportCsv(){
  var rows=[['Nummer','Klant','Factuurdatum','Vervaldatum','Excl btw','BTW','Totaal','Status','Betaald op']];
  DATA.invoices.forEach(function(iv){
    rows.push([iv.ref,custName(iv.customerId),iv.date,iv.due,invSub(iv).toFixed(2),invVat(iv).toFixed(2),invTot(iv).toFixed(2),invStatus(iv),iv.paidDate||'']);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marleo-facturen-'+today()+'.csv';a.click();toast('CSV gedownload, opent in Excel');
}
function importData(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d.invoices)throw 0;DATA=d;if(!DATA.expenses)DATA.expenses=[];saveData();toast('Back-up hersteld');go('dashboard')}
    catch(e){toast('Ongeldig back-upbestand',true)}
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm('ALLE gegevens wissen en terugzetten naar de startdata?'))return;
  if(!confirm('Echt zeker? Dit kan niet ongedaan gemaakt worden.'))return;
  DATA=seedData();saveData();toast('Alles gereset');go('dashboard');
}



/* ============ AIRTABLE LIVE-SYNC ============ */
function atCfg(){return DATA.settings&&DATA.settings.airtable?DATA.settings.airtable:(DATA.settings=DATA.settings||{},DATA.settings.airtable={token:'',base:'appqZHTc5zbx3hNSh',table:'tblU5dzzAenFL6qbp'})}
var AT_ST2STAGE=[[/nog niet gecontacteerd/i,'nieuw'],[/whatsapp verstuurd|gecontacteerd/i,'gecontacteerd'],[/in gesprek/i,'gesprek'],[/demo/i,'demo'],[/offerte/i,'offerte'],[/klant|gewonnen/i,'gewonnen'],[/verloren/i,'verloren'],[/geen whatsapp|niet bereikbaar/i,'nieuw']];
var AT_STAGE2ST={nieuw:'Nog niet gecontacteerd',gecontacteerd:'Gecontacteerd',gesprek:'In gesprek',demo:'Demo gemaakt',offerte:'Offerte verstuurd',gewonnen:'Klant',verloren:'Verloren'};
function atStage(status){for(var i=0;i<AT_ST2STAGE.length;i++){if(AT_ST2STAGE[i][0].test(status||''))return AT_ST2STAGE[i][1]}return 'nieuw'}
function atHeaders(){var c=atCfg();return{'Authorization':'Bearer '+c.token,'Content-Type':'application/json'}}
function atUrl(path){var c=atCfg();return 'https://api.airtable.com/v0/'+c.base+'/'+c.table+(path||'')}
async function atTest(){
  var c=atCfg();if(!c.token){toast('Vul eerst je Airtable-token in',true);return}
  try{var r=await fetch(atUrl('?maxRecords=1'),{headers:atHeaders()});
    if(r.ok){toast('\u2705 Verbinding met Airtable werkt!')}
    else{toast('Airtable zegt: '+r.status+', check token/rechten',true)}
  }catch(e){toast('Netwerkfout: '+e.message,true)}
}
async function atPull(silent){
  var c=atCfg();if(!c.token){toast('Vul eerst je Airtable-token in',true);return}
  if(!silent)toast('Airtable ophalen\u2026');
  try{
    var recs=[],offset='';
    do{
      var r=await fetch(atUrl('?pageSize=100'+(offset?'&offset='+offset:'')),{headers:atHeaders()});
      if(!r.ok){toast('Fout '+r.status+' bij ophalen',true);return}
      var j=await r.json();recs=recs.concat(j.records||[]);offset=j.offset||'';
    }while(offset);
    var added=0,updated=0;
    recs.forEach(function(rec){
      var f=rec.fields||{};if(!f['Naam'])return;
      var ex=DATA.deals.find(function(d){return d.atId===rec.id||d.naam.toLowerCase()===String(f['Naam']).toLowerCase()});
      var stage=atStage(f['Status']);
      var o={atId:rec.id,naam:f['Naam'],tel:f['Telefoon']||'',email:f['E-mailadres']||'',plaats:f['Plaats']||'',cat:f['Categorie']||'',
             rating:f['Rating']||'',reviews:f['Reviews']||'',online:f['Online aanwezigheid']||'',prio:f['Prio']||'',
             kanaal:f['Kanaal']||'',laatstContact:f['Laatste contact']||'',volgendeActie:f['Volgende actie']||'',
             demoLink:f['Demo-link']||'',bericht:f['Bericht']||'',waLink:f['WhatsApp-link']||'',onderwerp:f['Onderwerp']||'',
             note:f['Notities']||'',follow:f['Actie deadline']||''};
      if(ex){var wasStage=ex.stage;Object.assign(ex,o);if(['nieuw'].indexOf(ex.stage)>=0)ex.stage=stage;if(!ex.log)ex.log=[];if(wasStage!==ex.stage)ex.log.push({t:Date.now(),txt:'Airtable-sync: fase \u2192 '+stageLabel(ex.stage)});updated++}
      else{o.id=nid('deal');o.stage=stage;o.value=250;o.log=[{t:Date.now(),txt:'Ge\u00efmporteerd uit Airtable'}];o.created=Date.now();DATA.deals.push(o);added++}
    });
    saveData();logAct('Airtable-sync: '+added+' nieuw, '+updated+' bijgewerkt');
    DATA.lastSync=Date.now();DATA.lastSyncStats={added:added,updated:updated};saveData();
    if(added>0)logAct('\ud83d\udd04 Airtable-sync: '+added+' nieuwe lead'+(added>1?'s':'')+' toegevoegd'+(updated>0?', '+updated+' bijgewerkt':''));
    updateSyncBadge();
    if(!silent||added>0){toast('\u2705 Airtable-sync: '+added+' nieuw, '+updated+' bijgewerkt')}go(VIEW);
  }catch(e){toast('Fout: '+e.message,true)}
}

async function atPushOne(d){
  var c=atCfg();if(!c.token||!d||!d.atId)return;
  try{
    var flds={'Status':AT_STAGE2ST[d.stage]||d.stage,'Laatste contact':(d.laatstContact||new Date().toISOString().slice(0,10))};
    if(d.kanaal)flds['Kanaal']=d.kanaal;
    if(d.volgendeActie)flds['Volgende actie']=d.volgendeActie;
    if(d.follow)flds['Actie deadline']=d.follow;
    if(d.note)flds['Notities']=d.note;
    await fetch(atUrl('/'+d.atId),{method:'PATCH',headers:atHeaders(),body:JSON.stringify({fields:flds,typecast:true})});
  }catch(e){}
}

function logContact(id,kanaal){
  var d=DATA.deals.find(function(x){return x.id===id});if(!d)return;
  var vandaag=new Date().toISOString().slice(0,10);
  d.kanaal=kanaal;d.laatstContact=vandaag;
  if(d.stage==='nieuw')d.stage='gecontacteerd';
  (d.contacten=d.contacten||[]).push({t:Date.now(),kanaal:kanaal});
  (d.log=d.log||[]).push({t:Date.now(),txt:'\ud83d\udcde '+kanaal+' geregistreerd'});
  logAct(kanaal+' bij '+d.naam);
  atPushOne(d);saveData();
  toast('\u2705 '+kanaal+' genoteerd bij '+d.naam);
  if(document.getElementById('ptModal'))vDeal(id);else go(VIEW);
}
function setVolgende(id){
  var d=DATA.deals.find(function(x){return x.id===id});if(!d)return;
  var actie=prompt('Volgende actie voor '+d.naam+':',d.volgendeActie||'Opvolgen');
  if(actie===null)return;
  var datum=prompt('Op welke datum? (JJJJ-MM-DD)',d.follow||new Date().toISOString().slice(0,10));
  d.volgendeActie=actie;if(datum)d.follow=datum;
  (d.log=d.log||[]).push({t:Date.now(),txt:'\ud83d\udcc5 Volgende actie: '+actie+(datum?' ('+datum+')':'')});
  atPushOne(d);saveData();toast('Volgende actie ingesteld');
  if(document.getElementById('ptModal'))vDeal(id);else go(VIEW);
}
async function atPush(){
  var c=atCfg();if(!c.token){toast('Vul eerst je Airtable-token in',true);return}
  var linked=DATA.deals.filter(function(d){return d.atId});
  if(!linked.length){toast('Geen deals gekoppeld aan Airtable, doe eerst een import',true);return}
  toast('Statussen pushen\u2026');
  var today=new Date().toISOString().slice(0,10),ok=0,fail=0;
  for(var i=0;i<linked.length;i+=10){
    var batch=linked.slice(i,i+10).map(function(d){return{id:d.atId,fields:{'Status':AT_STAGE2ST[d.stage]||d.stage,'Laatste contact':today}}});
    try{
      var r=await fetch(atUrl(),{method:'PATCH',headers:atHeaders(),body:JSON.stringify({records:batch,typecast:true})});
      if(r.ok){ok+=batch.length}else{fail+=batch.length}
    }catch(e){fail+=batch.length}
  }
  logAct('Airtable-push: '+ok+' bijgewerkt'+(fail?', '+fail+' mislukt':''));
  toast(fail?('\u26a0\ufe0f '+ok+' ok, '+fail+' mislukt'):'\u2705 '+ok+' records bijgewerkt in Airtable');
}

var STAGES=[['nieuw','Nieuw'],['gecontacteerd','Gecontacteerd'],['gesprek','In gesprek'],['demo','Demo gemaakt'],['offerte','Offerte'],['gewonnen','Klant \u2713'],['verloren','Verloren']];
var MSG_TPL=function(d){
  return "Dag! \ud83d\udc4b Ik ben Giannis van Marleo (marleo.tech), een Belgisch webbureau voor lokale ondernemers. "+d.naam+" heeft een sterke reputatie, maar wie jullie opzoekt, vindt geen eigen website. Zonde!\n\nMijn aanbod, simpel en transparant: een professionele website op maat voor \u20ac250 eenmalig, \u00e1lles inbegrepen, geen abonnement, online binnen 48 uur, en de site is 100% jullie eigendom.\n\nBenieuwd? Dan maak ik gratis en vrijblijvend een demo zodat jullie kunnen zien hoe "+d.naam+" er online kan uitzien. Zal ik er eentje maken? \ud83d\ude42";
};
function telDigits(t){var x=String(t||'').replace(/[^0-9]/g,'');if(x.indexOf('0032')===0)x=x.slice(2);if(x.charAt(0)==='0')x='32'+x.slice(1);if(x.indexOf('32')!==0)x='32'+x;return x}
function dealWa(d){return 'https://wa.me/'+telDigits(d.tel)+'?text='+encodeURIComponent(MSG_TPL(d))}
function dealMail(d){return 'mailto:'+encodeURIComponent(d.email||'')+'?subject='+encodeURIComponent('Een website voor '+d.naam+'? Gratis demo')+'&body='+encodeURIComponent(MSG_TPL(d))}
function stageLabel(st){var f=STAGES.filter(function(x){return x[0]===st})[0];return f?f[1]:st}
function dealsIn(st){return DATA.deals.filter(function(d){return d.stage===st})}
function pipeValue(st){return dealsIn(st).reduce(function(s,d){return s+Number(d.value||0)},0)}

function rPipeline(){
  var open=DATA.deals.filter(function(d){return d.stage!=='gewonnen'&&d.stage!=='verloren'});
  var totV=open.reduce(function(s,d){return s+Number(d.value||0)},0);
  var today=new Date().toISOString().slice(0,10);
  var due=DATA.deals.filter(function(d){return d.follow&&d.follow<=today&&d.stage!=='gewonnen'&&d.stage!=='verloren'});
  main().innerHTML=
  '<div class="topbar"><div><h2>Pipeline</h2><div class="sub">'+open.length+' open deals \u00b7 '+eur(totV)+' potentieel'+(due.length?' \u00b7 <b style="color:#FCD34D">'+due.length+' op te volgen!</b>':'')+'</div></div>'+
  '<button class="btn" onclick="mDeal()">+ Nieuwe deal</button></div>'+
  '<div class="pipewrap">'+STAGES.map(function(st){
    var list=dealsIn(st[0]);
    return '<div class="pipecol"><div class="pipehead"><span>'+st[1]+'</span><span class="pipesum">'+list.length+' \u00b7 '+eur(pipeValue(st[0]))+'</span></div>'+
    (list.length?list.map(dealCard).join(''):'<div class="pipeempty">, </div>')+'</div>';
  }).join('')+'</div>';
}
function dealCard(d){
  var today=new Date().toISOString().slice(0,10);

function setStage(id,st){

  var vorige=d.stage;
  d.stage=st;(d.log=d.log||[]).push({t:Date.now(),txt:'Fase \u2192 '+stageLabel(st)});atPushOne(d);
  logAct('Deal '+d.naam+' \u2192 '+stageLabel(st));
  if(st==='gewonnen'&&vorige!=='gewonnen'){autoWin(d)}
  saveData();closeM();
  if(st==='gewonnen'){toast('\ud83c\udf89 Deal gewonnen! Klant + taken aangemaakt');vDeal(id)}else{go(VIEW)}
}
function autoWin(d){
  // 1) automatisch klant aanmaken (indien nog niet bestaat)
  var c=DATA.customers.find(function(x){return x.name.toLowerCase()===d.naam.toLowerCase()});
  if(!c){c={id:nid('cust'),name:d.naam,address:(d.plaats||''),vat:'',phone:d.tel||'',email:d.email||'',status:'actief',type:'klant',tags:['uit deal'],note:d.note||'',created:Date.now()};DATA.customers.push(c);logAct('\u2705 Automatisch klant aangemaakt: '+d.naam)}
  d.customerId=c.id;
  // 2) automatisch onboarding-taken aanmaken
  var vandaag=new Date();
  function plus(dagen){var x=new Date(vandaag);x.setDate(x.getDate()+dagen);return x.toISOString().slice(0,10)}
  var taken=[
    {title:'Factuur opmaken voor '+d.naam,due:plus(1),prio:'hoog'},
    {title:'Welkomstmail + gegevens opvragen ('+d.naam+')',due:plus(1),prio:'hoog'},
    {title:'Demo/website bouwen voor '+d.naam,due:plus(3),prio:'normaal'},
    {title:'Oplevering + review vragen aan '+d.naam,due:plus(10),prio:'normaal'}
  ];
  taken.forEach(function(t){DATA.tasks.push({id:nid('task'),title:t.title,desc:'Automatisch aangemaakt bij winst van deal',customerId:c.id,due:t.due,prio:t.prio,done:false})});
  logAct('\ud83d\udccb 4 onboarding-taken aangemaakt voor '+d.naam);
}

/* ============ TAKEN-POPUP (HubSpot-stijl herinneringen) ============ */
var _taskPopTimer=null;
var TASKPOP_MS=120000; // elke 2 min opnieuw checken
function dueTasks(){
  var vandaag=new Date().toISOString().slice(0,10);
  return DATA.tasks.filter(function(t){return !t.done && t.due && t.due<=vandaag});
}
function checkTaskPopups(){
  if(SESSION&&SESSION.role!=='admin')return;
  var due=dueTasks();
  if(!due.length){var ex=document.getElementById('taskPop');if(ex)ex.remove();return}
  showTaskPop(due);
}
function showTaskPop(due){
  var ex=document.getElementById('taskPop');if(ex)ex.remove();
  var vandaag=new Date().toISOString().slice(0,10);
  var wrap=document.createElement('div');wrap.id='taskPop';wrap.className='taskpop';
  var items=due.slice(0,5).map(function(t){
    var laat=t.due<vandaag;
    return '<div class="tp-item '+(t.prio==='hoog'?'hoog':'')+'">'+
      '<button class="tp-check" title="Afvinken" onclick="popDone(\''+t.id+'\')">\u2713</button>'+
      '<div class="tp-body"><div class="tp-title">'+esc(t.title)+'</div>'+
      '<div class="tp-meta">'+(laat?'\u26a0\ufe0f Te laat sinds ':'\ud83d\udcc5 Vandaag: ')+fmtD(t.due)+
      (t.customerId?' \u00b7 '+esc(custName(t.customerId)):'')+'</div></div>'+
      '<button class="tp-snooze" title="Morgen herinneren" onclick="popSnooze(\''+t.id+'\')">\u23f0</button></div>';
  }).join('');
  var meer=due.length>5?'<div class="tp-more">+'+(due.length-5)+' meer, zie Taken</div>':'';
  wrap.innerHTML='<div class="tp-head"><span>\ud83d\udd14 '+due.length+' taak'+(due.length>1?'en':'')+' te doen</span>'+
    '<button class="tp-x" onclick="document.getElementById(\'taskPop\').remove()">\u2715</button></div>'+
    items+meer+
    '<button class="tp-all" onclick="document.getElementById(\'taskPop\').remove();go(\'tasks\')">Alle taken bekijken</button>';
  document.body.appendChild(wrap);
}
function popDone(id){var t=DATA.tasks.find(function(x){return x.id===id});if(t){t.done=true;logAct('\u2713 Taak afgevinkt: '+t.title);saveData()}checkTaskPopups();if(VIEW==='tasks')go('tasks');if(VIEW==='dashboard')go('dashboard')}
function popSnooze(id){var t=DATA.tasks.find(function(x){return x.id===id});if(t){var x=new Date();x.setDate(x.getDate()+1);t.due=x.toISOString().slice(0,10);saveData()}checkTaskPopups()}
function startTaskPopups(){
  if(_taskPopTimer)clearInterval(_taskPopTimer);
  setTimeout(checkTaskPopups,1500); // kort na inloggen
  _taskPopTimer=setInterval(function(){if(document.visibilityState==='visible')checkTaskPopups()},TASKPOP_MS);
}
