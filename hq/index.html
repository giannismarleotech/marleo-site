/* ===================================================================
   PERSOONLIJKE OUTREACH: bericht past zich aan de situatie van de lead aan
   (geen site / alleen Facebook / kapot / verouderd / ok  +  IT-security)
   =================================================================== */
function leadHay(x){return ((x.flags||[]).join(' ')+' '+(x.online||'')+' '+(x.note||'')+' '+(x.cat||'')).toLowerCase()}
function leadHasWeb(x){return !!x.website||/website:\s*https?:/i.test(x.note||'')||/website ok|verouderd|niet mobiel|kapot/i.test(leadHay(x))}
function leadSituation(x){var h=leadHay(x);
  if(!leadHasWeb(x)||/geen website|geen eigen website/.test(h))return 'geen';
  if(/facebook|instagram|alleen facebook|linktr/.test(h))return 'social';
  if(/laadt niet|kapot|onbereikbaar|timeout|foutpagina|reageert niet/.test(h))return 'kapot';
  if(/verouderd|copyright 20(1|20|21|22)|niet mobiel|gratis sitebouwer|wordpress-standaard|bijna lege|geen https/.test(h))return 'oud';
  return 'ok'}
function leadFirstName(x){var n=x.contact||'';return n?n.split(' ')[0]:''}
function itIssues(x){var h=leadHay(x);var out=[];
  if(/geen dmarc/.test(h))out.push('mails in jullie naam kunnen vervalst worden (geen DMARC-bescherming)');
  else if(/dmarc.*(none|monitor)/.test(h))out.push('jullie phishing-bescherming staat nog op "monitoren" en blokkeert nog niks');
  if(/geen spf/.test(h))out.push('jullie e-mailadres is makkelijk te vervalsen (geen SPF)');
  if(/zonder https|geen https/.test(h))out.push('de website mist een beveiligde https-verbinding');
  if(/wordpress-versie|serverversie|zichtbaar/.test(h))out.push('de gebruikte software is publiek zichtbaar, wat hackers een voorsprong geeft');
  if(/geen hsts|beveiligingsheaders/.test(h))out.push('een aantal beveiligingsinstellingen ontbreken');
  return out}

/* WhatsApp = kort en persoonlijk */
function priceOf(re,fb){try{var p=(DATA.products||[]).find(function(x){return re.test(x.name||'')});return p&&p.price?'€'+String(p.price).replace('.',','):fb}catch(e){return fb}}
function nameHash(s){var n=0;String(s||'').split('').forEach(function(c){n=(n*31+c.charCodeAt(0))>>>0});return n}
function pick(arr,seed){return arr[nameHash(seed)%arr.length]}
/* ===== Persoonlijke berichten v3: sector, gemeente, reviews, concrete bevindingen ===== */
function leadCity(x){var c=x.city||x.plaats||'';if(!c&&x.adres){var m=/\b\d{4}\s+([^,]+)/.exec(x.adres);if(m)c=m[1]}return String(c).trim()}
function leadBenefit(x){var t=((x.cat||'')+' '+(x.sector||'')+' '+(x.naam||'')).toLowerCase();
  if(/kap|barb|coiff|beaut|schoonheid|nagel|salon|massage|wellness/.test(t))return 'klanten ook ’s avonds of in het weekend zelf online een afspraak boeken';
  if(/resto|horeca|frituur|brasser|caf|bistro|pizz|traiteur|bakker|brood|tearoom|snack|bar\b|hotel|b&b/.test(t))return 'je menu, openingsuren en een reservatie- of bestelknop mooi op één plek staan';
  if(/bouw|aannem|dak|schilder|elektr|loodgiet|renov|tegel|schrijnw|tuin|stukad|timmer|install|vloer|keuken|las|metaal|afsluit|omheining/.test(t))return 'je je realisaties toont en mensen meteen een offerte aanvragen';
  if(/garage|auto|carwash|band|polijst|carrosser/.test(t))return 'klanten zelf een afspraak maken en meteen je diensten en prijzen zien';
  if(/poets|schoonmaak|clean|ontruim/.test(t))return 'mensen meteen een prijs aanvragen voor hun woning of kantoor';
  if(/advoc|boekhoud|notar|consult|verzeker|fiscal|architect|immo/.test(t))return 'je professioneler overkomt en nieuwe klanten makkelijker contact opnemen';
  return 'mensen die je op Google zoeken je meteen vinden en contact opnemen'}
function leadReviewLine(x){var r=parseFloat(String(x.rating||'').replace(',','.'))||0,n=parseInt(x.reviews)||0;
  if(r>=4.3&&n>=8)return 'Ik zag dat jullie '+String(r).replace('.',',')+'★ hebben op Google met '+n+' reviews, knap! ';
  if(n>=25)return 'Ik zag dat jullie al '+n+' reviews hebben op Google, dus jullie zijn duidelijk goed bezig. ';
  return ''}
function leadSiteIssues(x){var h=leadHay(x),o=[];
  if(/niet mobiel/.test(h))o.push('niet goed werkt op gsm');
  if(/copyright|verouderd/.test(h))o.push('al een tijdje niet meer bijgewerkt lijkt');
  if(/gratis sitebouwer/.test(h))o.push('op een gratis sitebouwer draait');
  if(/geen https/.test(h))o.push('geen beveiligd slotje heeft');
  if(/bijna lege/.test(h))o.push('bijna leeg is');
  return o.slice(0,2)}

/* provincie uit postcode */
function zipProv(z){z=parseInt(z,10)||0;

  if((z>=1500&&z<=1999)||(z>=3000&&z<=3499))return 'Vlaams-Brabant';
  if(z>=2000&&z<=2999)return 'Antwerpen';
  if(z>=3500&&z<=3999)return 'Limburg';
  if(z>=4000&&z<=4999)return 'Luik';

  if((z>=6000&&z<=6599)||(z>=7000&&z<=7999))return 'Henegouwen';
  if(z>=6600&&z<=6999)return 'Luxemburg';
  if(z>=8000&&z<=8999)return 'West-Vlaanderen';
  if(z>=9000&&z<=9999)return 'Oost-Vlaanderen';
  return '';}
var PROVS=['Oost-Vlaanderen','West-Vlaanderen','Antwerpen','Vlaams-Brabant','Limburg','Brussel','Waals-Brabant','Luik','Henegouwen','Namen','Luxemburg'];
/* NACE-hoofdsector uit code */
function naceSector(code){var n=parseInt(String(code||'').slice(0,2),10)||0;
  if(n>=1&&n<=3)return 'Landbouw';if(n>=5&&n<=9)return 'Delfstoffen';if(n>=10&&n<=33)return 'Industrie/productie';
  if(n===35)return 'Energie';if(n>=36&&n<=39)return 'Water/afval';if(n>=41&&n<=43)return 'Bouw';
  if(n>=45&&n<=47)return 'Handel';if(n>=49&&n<=53)return 'Transport';if(n>=55&&n<=56)return 'Horeca';
  if(n>=58&&n<=63)return 'IT/media';if(n>=64&&n<=66)return 'Financieel';if(n===68)return 'Vastgoed';
  if(n>=69&&n<=75)return 'Vrije beroepen/advies';if(n>=77&&n<=82)return 'Zakelijke diensten';if(n===84)return 'Overheid';
  if(n===85)return 'Onderwijs';if(n>=86&&n<=88)return 'Gezondheid/welzijn';if(n>=90&&n<=93)return 'Cultuur/sport';
  if(n>=94&&n<=96)return 'Persoonlijke diensten';return 'Overig';}
var NC_SECTORS=['Handel','Horeca','Bouw','Vrije beroepen/advies','Zakelijke diensten','IT/media','Transport','Industrie/productie','Gezondheid/welzijn','Persoonlijke diensten','Vastgoed','Cultuur/sport','Overig'];
function fmtVat(v){v=String(v||'').replace(/[^0-9]/g,'');if(v.length===9)v='0'+v;if(v.length!==10)return v;return 'BE '+v.slice(0,4)+'.'+v.slice(4,7)+'.'+v.slice(7)}

/* ---- CSV helper (sniff , of ;) ---- */
function csvParse(txt){txt=txt.replace(/^﻿/,'');var lines=txt.split(/\r?\n/).filter(function(l){return l.length});if(!lines.length)return[];
  var delim=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
  function row(l){var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var c=l[i];if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}}out.push(cur);return out}
  var head=row(lines[0]).map(function(h){return h.trim()});var res=[];
  for(var i=1;i<lines.length;i++){var r=row(lines[i]);var o={};head.forEach(function(h,j){o[h]=(r[j]||'').trim()});res.push(o)}
  return res;}
function kboDate(s){s=String(s||'').trim();var m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(s);if(m)return m[3]+'-'+m[2]+'-'+m[1];m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[0]:''}

/* ---- minimale ZIP-uitpakker (DecompressionStream, geen externe lib) ---- */
async function unzip(buf){var dv=new DataView(buf),td=new TextDecoder();var files={};
  // zoek End Of Central Directory
  var eocd=-1;for(var i=buf.byteLength-22;i>=0&&i>buf.byteLength-22-65536;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('geen geldig zip-bestand');
  var cnt=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true),p=off;
  for(var k=0;k<cnt;k++){if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    var name=td.decode(new Uint8Array(buf,p+46,nlen));
    // lokale header
    var lnlen=dv.getUint16(lho+26,true),lelen=dv.getUint16(lho+28,true),dstart=lho+30+lnlen+lelen;
    var comp=new Uint8Array(buf,dstart,csize);
    if(/\.csv$/i.test(name)){files[name.split('/').pop()]={method:method,data:comp}}
    p+=46+nlen+elen+clen;
  }
  var out={};
  for(var fn in files){var f=files[fn];var bytes;
    if(f.method===0)bytes=f.data;
    else{var ds=new DecompressionStream('deflate-raw');var stream=new Response(f.data).body.pipeThrough(ds);bytes=new Uint8Array(await new Response(stream).arrayBuffer())}
    out[fn]=new TextDecoder('utf-8').decode(bytes);
  }
  return out;}

    '<div class="fgroup"><label>KBO-bestand(en)</label><input type="file" id="nc_file" accept=".zip,.csv" multiple></div>'+
    '<div class="frow"><div class="fgroup"><label>Alleen gestart na</label><select id="nc_since"><option value="90">laatste 3 maanden</option><option value="180">laatste 6 maanden</option><option value="365" selected>dit jaar</option><option value="99999">alles in het bestand</option></select></div>'+
    '<div class="fgroup"><label>Provincie</label><select id="nc_impprov"><option value="">heel België</option>'+PROVS.map(function(p){return '<option>'+p+'</option>'}).join('')+'</select></div></div>'+
    '<div id="nc_prog" class="hint"></div>',

async function newcoImport(){
  var inp=document.getElementById('nc_file');if(!inp.files.length){toast('Kies eerst een bestand',true);return}
  var sinceDays=parseInt(document.getElementById('nc_since').value)||365;var onlyProv=document.getElementById('nc_impprov').value;
  var prog=document.getElementById('nc_prog'),btn=document.getElementById('nc_go');btn.disabled=true;prog.textContent='Bestanden lezen…';
  try{
    var csv={};
    for(var f=0;f<inp.files.length;f++){var file=inp.files[f];
      if(/\.zip$/i.test(file.name)){prog.textContent='Zip uitpakken…';var un=await unzip(await file.arrayBuffer());for(var n in un)csv[n.toLowerCase()]=un[n]}
      else{csv[file.name.toLowerCase()]=await file.text()}
    }
    function find(part){for(var n in csv){if(n.indexOf(part)>=0)return csv[n]}return ''}
    var entTxt=find('enterprise'),denTxt=find('denomination'),addTxt=find('address'),actTxt=find('activity');
    if(!entTxt){throw new Error('Geen enterprise-bestand gevonden. Upload minstens enterprise(.csv) uit de KBO-data.')}
    prog.textContent='Verwerken…';await new Promise(function(r){setTimeout(r,20)});
    var cutoff=new Date(Date.now()-sinceDays*864e5).toISOString().slice(0,10);
    // enterprises filteren op startdatum
    var ents=csvParse(entTxt);var keep={};
    ents.forEach(function(e){var num=e.EnterpriseNumber||e.EntityNumber;var start=kboDate(e.StartDate);if(!num)return;if(sinceDays<99999&&(!start||start<cutoff))return;keep[num.replace(/\D/g,'')]={num:num,start:start,form:e.JuridicalForm||e.TypeOfEnterprise||''}});
    // namen
    var names={};if(denTxt)csvParse(denTxt).forEach(function(d){var num=(d.EntityNumber||'').replace(/\D/g,'');if(!num||!keep[num])return;var t=d.TypeOfDenomination;if(t&&t!=='001'&&names[num])return;if(!names[num]||d.Language==='2')names[num]=d.Denomination});
    // adressen
    var addr={};if(addTxt)csvParse(addTxt).forEach(function(a){var num=(a.EntityNumber||'').replace(/\D/g,'');if(!num||!keep[num]||addr[num])return;addr[num]={zip:a.Zipcode||'',city:a.MunicipalityNL||a.MunicipalityFR||'',street:(a.StreetNL||a.StreetFR||'')+' '+(a.HouseNumber||'')}});
    // activiteit (eerste nace)
    var nace={};if(actTxt)csvParse(actTxt).forEach(function(a){var num=(a.EntityNumber||'').replace(/\D/g,'');if(!num||!keep[num]||nace[num])return;nace[num]=a.NaceCode||''});
    // samenvoegen + dedupe
    var have={};(DATA.newco||[]).forEach(function(x){have[(x.vat||'').replace(/\D/g,'')]=1});
    DATA.deals.forEach(function(d){if(d.vat)have[String(d.vat).replace(/\D/g,'')]=1});
    DATA.customers.forEach(function(c){if(c.vat)have[String(c.vat).replace(/\D/g,'')]=1});
    var added=0,skip=0;
    Object.keys(keep).forEach(function(num){var e=keep[num];var ad=addr[num]||{};var prov=zipProv(ad.zip);
      if(onlyProv&&prov!==onlyProv)return;if(have[num]){skip++;return}
      var nm=names[num]||('Onderneming '+e.num);
      DATA.newco.push({id:nid('nc'),name:nm,vat:fmtVat(e.num),start:e.start,nace:nace[num]||'',sector:naceSector(nace[num]),
        zip:ad.zip||'',city:ad.city||'',street:(ad.street||'').trim(),prov:prov,form:e.form,bron:'KBO',status:'nieuw',added:today()});
      have[num]=1;added++;
    });
    saveData();if(typeof cloudPushChanged==='function')cloudPushChanged();
    closeM();toast('✅ '+added+' nieuwe bedrijven geïmporteerd'+(skip?' ('+skip+' al gekend)':''));go('newco');
  }catch(e){prog.innerHTML='<span style="color:#F87171">'+esc(e.message)+'</span>';btn.disabled=false}
}

    '<div class="tabs" style="margin:0">'+[['nieuw','Nieuw'],['gecontacteerd','Gecontacteerd'],['alle','Alle']].map(function(s){return '<button class="tab'+(NCFILT.status===s[0]?' active':'')+'" onclick="NCFILT.status=\''+s[0]+'\';rNewco()">'+s[1]+'</button>'}).join('')+'</div></div></div>'+

}
function newcoCard(x){var i="'"+x.id+"'";var adres=[x.street,(x.zip+' '+x.city).trim()].filter(Boolean).join(', ');

  if(BANK.busy)return;if(!sb||!CLOUD.uid)return;

    if(!d.ok)throw new Error(d.error||(r.error&&r.error.message)||'Wise gaf geen antwoord');

function bankAutoLink(){if(!BANK.data)return;var linked=0;
  var seen={};DATA.invoices.forEach(function(iv){if(iv.wiseId)seen[iv.wiseId]=1});
  var open=DATA.invoices.filter(function(iv){return iv.type!=='offerte'&&iv.status!=='concept'&&invStatus(iv)!=='betaald'});
  BANK.data.transactions.filter(bankIsClient).forEach(function(t){if(seen[t.id])return;
    var m=wiseMatchOne({amount:t.amount,from:t.title,ref:'',desc:t.desc,date:t.date},open);
    var nameOk=m&&(function(){var c=customer(m.iv.customerId);if(!c||!c.name)return false;var w=c.name.toUpperCase().split(/\s+/).filter(function(x){return x.length>2});return w.some(function(x){return t.title.toUpperCase().indexOf(x)>=0})})();
    if(m&&(m.how==='mededeling'||m.how==='bedrag + naam'||(m.how==='bedrag'&&nameOk))){m.iv.status='betaald';m.iv.paidDate=t.date;m.iv.wiseId=t.id;(m.iv.log=m.iv.log||[]).push({t:Date.now(),txt:'Automatisch betaald via Wise ('+eur(t.amount)+' van '+t.title+')'});open=open.filter(function(x){return x!==m.iv});linked++;logAct('🏦 '+m.iv.ref+' betaald via Wise')}
  });

function dContacts(d){return (d.contacten||[]).filter(function(c){return c&&c.t})}

function daysSince(iso){if(!iso)return null;return Math.floor((new Date(today()+'T00:00:00')-new Date(iso+'T00:00:00'))/864e5)}
function dOpen(d){return d.stage!=='gewonnen'&&d.stage!=='verloren'}
function dFollow(d){if(!d.follow)return '';var l=dLast(d);if(l&&l.date&&d.follow<l.date)return '';return d.follow}
function dDue(d){if(!dOpen(d))return false;var t=today();var f=dFollow(d);if(f)return f<=t;
  if(d.stage==='gecontacteerd'){var l=dLast(d);return !!(l&&daysSince(l.date)>=5)}return false}

var MXREM=false;
async function mxRemind(){if(MXREM||!gConnected())return;MXREM=true;try{var mc=bkMailCfg(),t=ag2Today(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),ch=false;
  for(var i=0;i<DATA.appointments.length;i++){var a=DATA.appointments[i];
    if(!a.guestEmail||!a.time||a.date!==t||a.pending||a.declined||a.kind==='prive')continue;
    var st=bkMin(a.time),left=st-nm;if(left<=0)continue;
    if(mc.rem30&&!a.mRem30&&left<=30&&await mxClaim(a,'rem30')){a.mRem30=true;a.mRem=true;ch=true;saveData();try{await mxSend('rem30',a)}catch(e){a.mRem30=false;mxRelease(a,'rem30')}continue}
    if(mc.rem&&!a.mRem&&nm>=480&&left>60&&a.confDay!==t&&await mxClaim(a,'rem')){a.mRem=true;ch=true;saveData();try{await mxSend('rem',a)}catch(e){a.mRem=false;mxRelease(a,'rem')}}}

function mxHash(x){var h=5381;for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return String(h)}
function mxDesired(){var mc=bkMailCfg(),out=[],now=Date.now(),t=ag2Today();
  DATA.appointments.forEach(function(a){if(!a.guestEmail||!a.time||a.pending||a.declined||a.kind==='prive'||a.date<t)return;
    var st=new Date(a.date+'T'+a.time+':00').getTime();if(!(st>now))return;
    if(mc.rem30){var at=st-30*60000;if(at>now-60000)out.push({a:a,kind:'rem30',at:at})}
    if(mc.rem){var d8=new Date(a.date+'T08:00:00').getTime();if(st-d8>60*60000&&d8>now-60000&&a.confDay!==a.date)out.push({a:a,kind:'rem',at:d8})}});
  return out}
var MXSYNC=false;
async function mxSyncQueue(){if(MXSYNC||!MXSRV.ready||!sb||!CLOUD||!CLOUD.uid)return;MXSYNC=true;try{
  var since=new Date(Date.now()-864e5).toISOString();
  var r=await sb.from('mail_queue').select('id,appt_id,kind,send_at,sig,status').in('kind',['rem','rem30']).in('status',['pending','sending','sent']).gte('send_at',since);if(r.error)throw r.error;
  var rows=r.data||[],want=mxDesired(),keep={};
  for(var i=0;i<want.length;i++){var w=want[i],m=mxBuild(w.kind,w.a),sig=mxHash(m.html+'|'+new Date(w.at).toISOString());
    var hit=rows.filter(function(x){return x.appt_id===w.a.id&&x.kind===w.kind&&x.sig===sig})[0];
    if(hit){keep[hit.id]=1;continue}
    if(rows.some(function(x){return x.appt_id===w.a.id&&x.kind===w.kind&&x.status==='sent'&&Math.abs(new Date(x.send_at).getTime()-w.at)<60000}))continue;
    var ins=await sb.from('mail_queue').insert({send_at:new Date(w.at).toISOString(),to_email:w.a.guestEmail,subject:m.subject,html:m.html,body_text:m.text||null,kind:w.kind,appt_id:w.a.id,sig:sig,status:'pending'}).select('id');
    if(ins.data&&ins.data[0])keep[ins.data[0].id]=1}
  var stale=rows.filter(function(x){return x.status==='pending'&&!keep[x.id]}).map(function(x){return x.id});
  if(stale.length)await sb.from('mail_queue').update({status:'cancelled',error:'afspraak gewijzigd of geannuleerd'}).in('id',stale)
  }catch(e){console.warn('mxSync',e)}MXSYNC=false}

function cpVars(d,t){var first=String(d.contact||'').trim().split(/\s+/)[0]||'';

function cpAudience(f){var used={};CAMP.rows.forEach(function(x){used[String(x.to_email).toLowerCase()]=1});var un={};CAMP.unsub.forEach(function(x){un[x.email]=1});
  var cust={};(DATA.customers||[]).forEach(function(c){if(c.email)cust[c.email.toLowerCase()]=1});var seen={};
  return DATA.deals.filter(function(d){var e=String(d.email||'').toLowerCase().trim();if(!e||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)||seen[e])return false;

function cpSlots(n,limit){var out=[],now=new Date(),day=new Date(now);day.setSeconds(0,0);
  var i=0;while(i<n){var dow=day.getDay();if(dow>0&&dow<6){var start=9*60+5,end=16*60+30,cur=day.getHours()*60+day.getMinutes()+5,lo=Math.max(start,cur);
      if(day.toDateString()!==now.toDateString())lo=start;var room=end-lo;
      if(room>=10){var take=Math.min(limit,n-i,Math.floor(room/4)+1);var step=take>1?room/(take-1):0;
        for(var k=0;k<take;k++){var m=Math.round(lo+k*step+(Math.random()*2-1));var t=new Date(day);t.setHours(Math.floor(m/60),m%60,Math.floor(Math.random()*50),0);if(t<new Date(Date.now()+60000))t=new Date(Date.now()+60000+k*240000);out.push(t)}i+=take}}
    day=new Date(day.getFullYear(),day.getMonth(),day.getDate()+1,0,0,0)}
