/* ===================================================================
   3) OPVOLGREEKSEN  (automatische cadans van taken)
   =================================================================== */
function seqDefs(){if(!DATA.sequences||!DATA.sequences.length)DATA.sequences=[
  {id:'seq-web',naam:'Koude lead – website',steps:[
    {day:0,ch:'mail',txt:'Eerste mail: stel jezelf voor + gratis scan of demo aanbieden'},
    {day:3,ch:'wa',txt:'WhatsApp/bel: "heb je mijn mailtje gezien?"'},
    {day:7,ch:'bel',txt:'Bellen: kort de voordelen overlopen, demo voorstellen'},
    {day:14,ch:'mail',txt:'Laatste mail: "laatste keer dat ik contacteer, interesse?"'}]},
  {id:'seq-it',naam:'Groter bedrijf – IT/security',steps:[
    {day:0,ch:'mail',txt:'Scan-rapport doorsturen met de bevindingen'},
    {day:4,ch:'bel',txt:'Bellen: rapport toelichten, gesprek voorstellen'},
    {day:10,ch:'mail',txt:'Case/aanbod sturen (e-mailbeveiliging of audit)'},
    {day:21,ch:'bel',txt:'Laatste opvolging'}]}
];return DATA.sequences}
function seqById(id){return seqDefs().find(function(s){return s.id===id})}
var SEQ_CH={mail:{label:'Mail',ic:'✉️'},wa:{label:'WhatsApp',ic:'💬'},bel:{label:'Bellen',ic:'📞'}};
function seqStart(dealId,seqId){var d=DATA.deals.find(function(x){return x.id===dealId});var s=seqById(seqId);if(!d||!s)return;
  d.seq={id:seqId,start:today(),step:0};(d.log=d.log||[]).push({t:Date.now(),txt:'▶ Opvolgreeks gestart: '+s.naam});saveData();
  seqTasks();logAct('Opvolgreeks "'+s.naam+'" gestart voor '+d.naam);toast('Opvolgreeks gestart – taken staan klaar');
  if(typeof VIEW!=='undefined')go(VIEW);
}
function seqStop(dealId,silent){var d=DATA.deals.find(function(x){return x.id===dealId});if(!d||!d.seq)return;
  DATA.tasks=DATA.tasks.filter(function(t){return !(t.seqDeal===dealId&&!t.done)});
  (d.log=d.log||[]).push({t:Date.now(),txt:'⏹ Opvolgreeks gestopt'});d.seq=null;saveData();if(!silent){toast('Opvolgreeks gestopt');if(typeof VIEW!=='undefined')go(VIEW)}}
function seqTasks(){ // idempotent: maakt per lopende reeks de taken aan
  var t=today();
  DATA.deals.forEach(function(d){
    if(!d.seq)return;
    if(d.stage==='gewonnen'||d.stage==='verloren'){seqStop(d.id,true);return}
    var s=seqById(d.seq.id);if(!s)return;
    var cid=(DATA.customers.find(function(c){return c.name.toLowerCase()===(d.naam||'').toLowerCase()})||{}).id||'';
    s.steps.forEach(function(st,i){
      var due=plusDays(d.seq.start,st.day);var key='seq-'+d.id+'-'+i;
      autoTask(key,SEQ_CH[st.ch].ic+' '+SEQ_CH[st.ch].label+' – '+d.naam+' (stap '+(i+1)+'/'+s.steps.length+')',due,st.day<=1?'hoog':'normaal',cid,st.txt+(d.tel?'\nTel: '+d.tel:'')+(d.email?'\nMail: '+d.email:''));
      var tk=DATA.tasks.find(function(x){return x.key===key});if(tk){tk.seqDeal=d.id;tk.seqStep=i}
    });
  });
  saveData();
}
/* wanneer je contact registreert bij een lead: reeks stopt automatisch als ze antwoorden?
   Nee – contact = jij stuurt. We laten de reeks lopen maar tonen voortgang. Bij fase demo/offerte/gewonnen stopt hij vanzelf via seqTasks. */
var _logContact0=(typeof logContact==='function')?logContact:null;
function seqProgress(d){if(!d||!d.seq)return '';var s=seqById(d.seq.id);if(!s)return '';
  var done=DATA.tasks.filter(function(t){return t.seqDeal===d.id&&t.done}).length;
  return '<div class="notecard" style="border-color:rgba(124,58,237,.4)"><div class="meta">▶ Opvolgreeks: '+esc(s.naam)+' – '+done+'/'+s.steps.length+' stappen gedaan</div>'+
    '<div style="display:flex;gap:4px;margin:6px 0">'+s.steps.map(function(st,i){var tk=DATA.tasks.find(function(t){return t.seqDeal===d.id&&t.seqStep===i});var cls=tk&&tk.done?'#22c55e':(tk&&tk.due<=today()?'#F5A623':'#3a3f52');return '<div title="'+esc(SEQ_CH[st.ch].label+': '+st.txt)+'" style="flex:1;height:6px;border-radius:3px;background:'+cls+'"></div>'}).join('')+'</div>'+
    '<button class="btn sm subtle" onclick="seqStop(\''+d.id+'\')">⏹ Stop reeks</button></div>'}
function mSeqStart(dealId){var opts=seqDefs().map(function(s){return '<option value="'+s.id+'">'+esc(s.naam)+' ('+s.steps.length+' stappen)</option>'}).join('');
  openM('▶ Opvolgreeks starten','<div class="fgroup"><label>Welke reeks?</label><select id="seq_pick">'+opts+'</select></div><div class="hint">De CRM maakt automatisch taken aan op de juiste dagen. De reeks stopt vanzelf zodra de lead naar "demo", "offerte" of "gewonnen" gaat – of stop hem handmatig.</div>','<button class="btn subtle" onclick="closeM()">Annuleren</button><button class="btn" onclick="seqStart(\''+dealId+'\',document.getElementById(\'seq_pick\').value);closeM()">Start</button>')}

/* reeks-beheer in Instellingen */
function seqManagerHtml(){return '<div class="panelbox" style="margin-bottom:18px"><h3>▶ Opvolgreeksen <button class="btn sm" style="float:right" onclick="seqAdd()">+ Nieuwe reeks</button></h3>'+
  '<div class="hint" style="margin-bottom:8px">De vaste opvolgstappen voor koude leads. Pas de dagen, kanalen en teksten aan zoals jij werkt.</div>'+
  seqDefs().map(function(s){return '<div class="notecard" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b>'+esc(s.naam)+'</b><button class="iconbtn del" onclick="seqDel(\''+s.id+'\')">🗑</button></div>'+
    '<table style="margin-top:6px"><tbody>'+s.steps.map(function(st,i){return '<tr><td style="width:70px"><input type="number" value="'+st.day+'" style="width:56px" onchange="seqEdit(\''+s.id+'\','+i+',\'day\',this.value)"> d</td><td style="width:120px"><select onchange="seqEdit(\''+s.id+'\','+i+',\'ch\',this.value)">'+Object.keys(SEQ_CH).map(function(k){return '<option value="'+k+'" '+(st.ch===k?'selected':'')+'>'+SEQ_CH[k].ic+' '+SEQ_CH[k].label+'</option>'}).join('')+'</select></td><td><input value="'+esc(st.txt)+'" onchange="seqEdit(\''+s.id+'\','+i+',\'txt\',this.value)" style="width:100%"></td><td style="width:30px"><button class="iconbtn del" onclick="seqStepDel(\''+s.id+'\','+i+')">×</button></td></tr>'}).join('')+'</tbody></table>'+
    '<button class="btn sm subtle" style="margin-top:6px" onclick="seqStepAdd(\''+s.id+'\')">+ stap</button></div>'}).join('')+'</div>'}
function seqEdit(id,i,f,v){var s=seqById(id);if(!s)return;s.steps[i][f]=(f==='day'?parseInt(v)||0:v);saveData()}
function seqStepAdd(id){var s=seqById(id);s.steps.push({day:(s.steps.length?s.steps[s.steps.length-1].day+7:0),ch:'mail',txt:'Nieuwe stap'});saveData();rSettings()}
function seqStepDel(id,i){var s=seqById(id);s.steps.splice(i,1);saveData();rSettings()}
function seqAdd(){var naam=prompt('Naam van de reeks:','Nieuwe reeks');if(!naam)return;seqDefs().push({id:'seq'+Date.now().toString(36),naam:naam,steps:[{day:0,ch:'mail',txt:'Eerste contact'}]});saveData();rSettings()}
function seqDel(id){if(!confirm('Reeks verwijderen?'))return;DATA.sequences=seqDefs().filter(function(s){return s.id!==id});saveData();rSettings()}

/* ---------- inhaken op bestaande schermen ---------- */
/* vDeal: knoppen voor scan, demo, reeks + reeks-voortgang tonen */
(function(){var _vDeal1=vDeal;vDeal=function(id){_vDeal1(id);var d=DATA.deals.find(function(x){return x.id===id});if(!d)return;

    '<button class="btn sm subtle" onclick="closeM();mDemo(\''+id+'\')">🎨 Demo</button>'+
    (d.seq?'':'<button class="btn sm subtle" onclick="closeM();mSeqStart(\''+id+'\')">▶ Opvolgreeks</button>');
  f.insertAdjacentHTML('afterbegin',extra)}})();

/* Leadfinder-rij: scan-knop toevoegen naast de pitch-knop */
(function(){var _rLeads1=rLeads;rLeads=function(){_rLeads1();
  main().querySelectorAll('table tbody tr').forEach(function(tr,i){var acts=tr.querySelector('.rowactions');if(acts&&LEADS[i]&&LEADS[i].website&&!acts.querySelector('.scanbtn')){

(function(){var _rLeads2=rLeads;rLeads=function(){_rLeads2();var tb=main().querySelector('.topbar');if(tb&&!tb.querySelector('.gxbtns')){var div=tb.querySelector('div:last-child');
  var html='<span class="gxbtns"></span>';if(div){div.insertAdjacentHTML('afterbegin','<button class="btn subtle" onclick="mScan()">🔍 Losse scan</button><button class="btn subtle" onclick="mDemo()">🎨 Demo maken</button>')}}}})();

/* Instellingen: reeks-beheer erbij */
(function(){var _rSettings1=rSettings;rSettings=function(){_rSettings1();var el=main();var tmp=document.createElement('div');tmp.innerHTML=seqManagerHtml();
  var koppel=Array.prototype.slice.call(el.querySelectorAll('.panelbox')).filter(function(p){return /Koppelingen/.test((p.querySelector('h3')||{}).textContent||'')})[0];
  if(koppel&&koppel.nextSibling)el.insertBefore(tmp.firstChild,koppel.nextSibling);else el.appendChild(tmp.firstChild)}})();

/* reeks-taken meelaten draaien met autoTasks */
(function(){var _autoTasks1=autoTasks;autoTasks=function(){_autoTasks1();try{seqTasks()}catch(e){console.warn('seqTasks',e)}}})();

/* menu: verkoop-tools bereikbaar via Outreach-scherm knoppen */
(function(){var _rOutreach1=(typeof rOutreach==='function')?rOutreach:null;if(_rOutreach1){rOutreach=function(){_rOutreach1();var tb=main().querySelector('.topbar');if(tb){var div=tb.querySelector('div:last-child')||tb;div.insertAdjacentHTML('beforeend','<button class="btn subtle" onclick="mScan()" style="margin-left:6px">🔍 Scan</button><button class="btn subtle" onclick="mDemo()">🎨 Demo</button>')}}}})();
