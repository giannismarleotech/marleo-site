[functions.seo-intake]
# Handler authenticates each request with a random 256-bit per-questionnaire token.
verify_jwt = false

[functions.hq-hosting]
# Gateway JWT verification plus verified owner/live-session authorization in the handler.
verify_jwt = true

[functions.hq-portal]
# Public login requests are scoped/rate-limited; all other actions verify Auth + live session and server-side permissions.
verify_jwt = false

[functions.mailhook]
# Provider callbacks authenticate via Svix signatures, or the existing server-only hook token until a signing secret is installed.
verify_jwt = false

[functions.campaign-admin]
# Owner JWT is verified in the handler; a fixed one-time setup job can only be requested in the server-only database config.
verify_jwt = false

[functions.hq-agent-source]
# Gateway JWT and independently verified Marleo owner. Fetches bounded public source text only; no AI API or outbound mail.
verify_jwt = true

[functions.hq-agent-run]
verify_jwt = true

[functions.hq-agent-jobs]
verify_jwt = true
