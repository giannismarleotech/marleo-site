<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Uitschrijven · Marleo</title>
<style>:root{color-scheme:dark}body{margin:0;background:#120d12;color:#eee;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}.c{max-width:440px;text-align:center}h1{font-size:24px;margin:0 0 12px}p{color:#bbb;line-height:1.6}button{background:linear-gradient(90deg,#ff8a2b,#ff2a86);color:#fff;border:0;border-radius:12px;padding:14px 24px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}small{display:block;margin-top:28px;color:#777}a{color:#ff6aa8}</style></head>
<body><div class="c"><h1 id="t">Uitschrijven</h1><p id="m">Wil je geen mails meer ontvangen van Marleo?</p><button id="b">Ja, uitschrijven</button><small>Marleo · <a href="/">marleo.tech</a></small></div>
<script>(function(){var API='https://ufzwdhbrmycjtlewstaw.supabase.co/functions/v1/outreach',tok=new URLSearchParams(location.search).get('u')||'',t=document.getElementById('t'),m=document.getElementById('m'),b=document.getElementById('b');
function done(){t.textContent='Je bent uitgeschreven';m.textContent='Je ontvangt geen mails meer van Marleo. Sorry voor het storen.';b.style.display='none'}
function bad(){t.textContent='Link niet gevonden';m.innerHTML='Deze link werkt niet. Antwoord gewoon op de mail met "uitschrijven" of mail <a href="mailto:giannis@marleo.tech?subject=uitschrijven">giannis@marleo.tech</a>.';b.style.display='none'}
function call(a){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,token:tok})}).then(function(r){return r.json()})}
if(!tok)return bad();call('unsubStatus').then(function(j){if(!j.ok)bad();else if(j.done)done()}).catch(function(){});
b.onclick=function(){b.disabled=true;call('unsub').then(function(j){j.ok?done():bad()}).catch(function(){b.disabled=false;m.textContent='Er ging iets mis, probeer opnieuw.'})}})();</script></body></html>
